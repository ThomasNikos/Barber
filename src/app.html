<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barber · Καλαμάτα</title>
<meta name="theme-color" content="#1c1915">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3Cpattern id='p' width='14' height='14' patternUnits='userSpaceOnUse' patternTransform='rotate(-38)'%3E%3Crect width='14' height='14' fill='%23fff'/%3E%3Crect width='4.5' height='14' fill='%23c0392b'/%3E%3Crect x='7' width='4.5' height='14' fill='%232a5d8a'/%3E%3C/pattern%3E%3C/defs%3E%3Crect x='2' y='2' width='60' height='60' rx='14' fill='%231c1915'/%3E%3Crect x='23' y='14' width='18' height='36' rx='4' fill='url(%23p)'/%3E%3Crect x='20' y='8' width='24' height='8' rx='3.5' fill='%23d8a650'/%3E%3Crect x='20' y='48' width='24' height='8' rx='3.5' fill='%23d8a650'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1ea; --surface:#fffdf9; --surface2:#efe9df; --ink:#1c1915; --muted:#6e665a; --line:#e0d8ca;
  --accent:#9c6a22; --accent-soft:#f1e3cb; --pos:#2c7a4b; --pos-soft:#dcefe2; --neg:#b0402d; --neg-soft:#f7dfd9;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#8a8172;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13110e; --surface:#1c1915; --surface2:#26221c; --ink:#f0e9de; --muted:#a59b8b; --line:#332e26;
    --accent:#d8a650; --accent-soft:#3a2e1b; --pos:#62c08a; --pos-soft:#1c3326; --neg:#e57a66; --neg-soft:#3d221d;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#8f8778;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13110e; --surface:#1c1915; --surface2:#26221c; --ink:#f0e9de; --muted:#a59b8b; --line:#332e26;
  --accent:#d8a650; --accent-soft:#3a2e1b; --pos:#62c08a; --pos-soft:#1c3326; --neg:#e57a66; --neg-soft:#3d221d;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#8f8778;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Commissioner,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}

/* header */
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 6px}
.logo{display:flex;align-items:center;gap:10px}
.pole{width:10px;height:28px;border-radius:5px;background:repeating-linear-gradient(-45deg,#c0392b 0 5px,#fff 5px 10px,#2a5d8a 10px 15px,#fff 15px 20px);border:1px solid var(--line)}
.logo h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
.logo small{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em;margin-top:-2px}
.hbtns{display:flex;gap:6px}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.strip{display:flex;gap:22px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.st{white-space:nowrap}
.st>span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.st b{font-size:17px;font-weight:700}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;white-space:nowrap;color:var(--muted);font-weight:500;font-size:14px}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}

main{padding:18px 0 60px}
h2{font-size:22px;margin:4px 0 4px;font-weight:700;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 10px;font-weight:700}
.lead{color:var(--muted);margin:0 0 16px;max-width:760px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.kgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.flat{background:var(--surface2)}
.sec{margin-top:14px}
.kpi>span{display:block;font-size:12px;color:var(--muted)}
.kpi b{display:block;font-size:22px;font-weight:700;margin-top:2px;letter-spacing:-.01em}
.kpi em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row.tot{font-weight:700;border-top:1px solid var(--ink);border-bottom:0;margin-top:4px;padding-top:8px}
.row.sub{font-weight:600}
.row .l{color:var(--muted)}
.row.tot .l,.row.sub .l{color:var(--ink)}
.small{font-size:12.5px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 12px;margin-top:10px}
.warn{background:var(--neg-soft);color:var(--ink)}

/* fields */
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label.f>span{font-size:12px;color:var(--muted)}
label.f>em{font-style:normal;font-size:11.5px;color:var(--muted)}
.inp{display:flex;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.inp:focus-within{border-color:var(--accent)}
.inp input,.inp select{flex:1;min-width:0;border:0;background:none;color:inherit;font:inherit;padding:7px 9px;outline:none;-moz-appearance:textfield}
.inp input::-webkit-inner-spin-button{opacity:.4}
.inp i{font-style:normal;color:var(--muted);font-size:13px;padding-right:9px;white-space:nowrap}
input.txt{width:100%;border:1px solid transparent;background:none;color:inherit;font:inherit;padding:4px 6px;border-radius:6px;margin-left:-6px}
input.txt:hover{border-color:var(--line)} input.txt:focus{border-color:var(--accent);outline:none;background:var(--surface2)}
input.name{font-size:17px;font-weight:700}
select.sel{width:100%;border:1px solid var(--line);background:var(--surface2);color:inherit;font:inherit;padding:7px 9px;border-radius:8px}
input[type=range]{width:100%;accent-color:var(--accent)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px}
.btn.sec2{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.x{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:4px 6px;border-radius:6px}
.x:hover{color:var(--neg);background:var(--neg-soft)}
.btns{display:flex;flex-wrap:wrap;gap:8px}

/* barbers */
.bc{position:relative}
.bc .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.bc .hd input{flex:1}
.mode{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.slider{margin:6px 0 10px}
.slider .top{display:flex;justify-content:space-between;align-items:baseline}
.slider .top b{font-size:20px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.res div{background:var(--surface2);border-radius:9px;padding:8px 10px}
.res span{display:block;font-size:11.5px;color:var(--muted)}
.res b{font-size:16px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em}
.tbl td{padding:4px 6px;border-bottom:1px dashed var(--line);vertical-align:middle}
.tbl td.num,.tbl th.num{text-align:right}
.tbl .inp{min-width:90px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cap-item{display:grid;grid-template-columns:24px 1fr 120px 28px;gap:6px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
.capx{grid-template-columns:24px 1fr auto 28px;padding:6px 0}
.capx .cxt{white-space:nowrap;font-size:15px}
.capx .qu{grid-column:2/4;display:flex;align-items:center;gap:6px}
.qu .q{width:92px}
.qu .u{width:140px}
.capx .nt{grid-column:2/4}
.cap-item .nt{grid-column:2/4;font-size:12px;color:var(--muted);margin-top:-4px}
.cap-item.off{opacity:.5}
.cathd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.cathd b{font-size:15px}

/* bars */
.bars .b{margin:7px 0}
.bars .bl{display:flex;justify-content:space-between;font-size:13px}
.bars .bt{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:3px}
.bars .bf{height:100%;border-radius:99px}
.stack{display:flex;height:22px;border-radius:7px;overflow:hidden;margin:6px 0 10px;background:var(--surface2)}
.stack div{height:100%}
.legend{display:flex;flex-direction:column;gap:3px}
.legend .row span:first-child{display:flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}

/* heat */
.heat{border-collapse:separate;border-spacing:3px;width:100%;font-size:13px}
.heat th{font-size:11.5px;color:var(--muted);font-weight:600;padding:4px}
.heat td{text-align:center;padding:8px 4px;border-radius:7px;font-weight:600;white-space:nowrap}
.heat td.cur{outline:2px solid var(--ink);outline-offset:-2px}

.models{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.model{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface2)}
.model.best{border-color:var(--pos);box-shadow:inset 0 0 0 1px var(--pos)}
.model b{font-size:20px;display:block}
svg text{fill:var(--muted);font-size:12px;font-family:inherit}
.scn{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
@media (max-width:600px){
  .hbtns{gap:4px}
  .hbtns .ghost{padding:6px 8px}
  #logoutBtn .lbl{display:none}
  #logoutBtn .ico2{display:inline}
  .logo small{font-size:10.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pole{flex:none}
  .strip{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 12px;overflow:visible}
  .st b{font-size:15px}
  .st>span{font-size:9.5px}
  #lockBtn .lbl{display:none}
  #lockBtn svg{margin-right:0}
  h2{font-size:19px}
  .kpi b{font-size:19px}
  .card{padding:13px}
  .capx{grid-template-columns:22px 1fr auto 26px}
  .qu .q{width:84px}
  .qu .u{width:124px}
}
.ghost.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ghost svg{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
.lockbar svg{width:15px;height:15px;vertical-align:-2px;margin-right:6px;flex:none}
.tbl input.txt{min-width:130px}
body.locked [data-act^="add"],body.locked [data-act^="del"],body.locked [data-act="reset"],body.locked [data-act="import"],body.locked [data-act="importCsvBtn"],body.locked [data-act="loadScn"]{display:none!important}
body.locked #view input:disabled,body.locked #view select:disabled{opacity:.75;cursor:not-allowed}
body.locked input.txt:hover{border-color:transparent}
.lockbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:14px}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 24px rgba(0,0,0,.18);opacity:0;transition:opacity .1s;max-width:260px}
.tip.on{opacity:1}
.tip b{display:block;margin-bottom:4px;font-size:13px}
.tip .tr{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip .tr span:first-child{display:flex;align-items:center;gap:6px;color:var(--muted)}
.tip .tr span:last-child{font-weight:600}
svg.chart{display:block;touch-action:pan-y;overflow:visible}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:14px;height:3px;border-radius:2px;display:inline-block}
.lg i.sq{width:10px;height:10px;border-radius:3px}
.lg i.dash{background:none!important;border-top:2px dashed currentColor;height:0}
.donutwrap{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.donutwrap svg{flex:none}
.donutwrap .legend{flex:1;min-width:200px}
.hb{margin:10px 0}
.hb .nm{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px}
.hb .tr2{display:flex;align-items:center;gap:8px;margin:3px 0}
.hb .bar{height:10px;border-radius:0 4px 4px 0;min-width:2px}
.hb .v{font-size:12.5px;color:var(--muted);white-space:nowrap}
.yrs td,.yrs th{text-align:right}
.yrs td:first-child,.yrs th:first-child{text-align:left}
.sub2{font-size:13px;font-weight:600;margin:16px 0 4px}
.hrow{padding:10px 0;border-bottom:1px dashed var(--line)}
.hrow:last-child{border-bottom:0}
.hrow.login{padding:6px 0;opacity:.75}
.hmeta{display:flex;justify-content:space-between;gap:10px}
.hch{margin:4px 0 0;padding-left:18px;font-size:13.5px}
.hch li{margin:2px 0}
.hbtn{margin-top:8px;font-size:13px;padding:6px 10px}
body.target header.top{background:color-mix(in srgb,var(--accent-soft) 85%,transparent);border-bottom-color:var(--accent)}
body.target header.top::before{content:"";display:block;height:4px;background:var(--accent)}
.viewbtn{font-weight:600}
.viewbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.viewbtn svg{width:14px;height:14px;vertical-align:-2px;margin-right:5px}
.tgtbar{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.tgtbar .t{font-weight:800;letter-spacing:.12em;color:var(--accent)}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px;margin:10px 0}
.cmp div{background:var(--surface);border-radius:9px;padding:7px 10px}
.cmp span{display:block;font-size:11.5px;color:var(--muted)}
.cmp b{font-size:16px}
.cmp em{font-style:normal;font-size:12px;margin-left:6px}
.viewbtn .ico{display:none}
.ico2{display:none;width:14px;height:14px;vertical-align:-2px}
#playBtn.on{background:var(--c1);border-color:var(--c1)}
body.play header.top{background:color-mix(in srgb,var(--c1) 12%,var(--bg));border-bottom-color:var(--c1)}
body.play header.top::before{content:"";display:block;height:4px;background:var(--c1)}
.playbar{background:color-mix(in srgb,var(--c1) 10%,var(--surface));border-color:var(--c1)}
.playbar .t{color:var(--c1)}
.playbar .btn:not(.sec2){background:var(--c1)}
@media (max-width:600px){.viewbtn .lbl{display:none}.viewbtn svg{margin-right:0}.viewbtn .ico{display:inline}}
.mn .big{display:block;font-size:24px;font-weight:700;margin:2px 0 6px}
.mn.ok .big{color:var(--pos)} .mn.bad .big{color:var(--neg)}
.mnbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-bottom:6px}
.mnbar div{height:100%;border-radius:99px;background:var(--muted)}
.mn.ok .mnbar div{background:var(--pos)} .mn.bad .mnbar div{background:var(--neg)}
.ot{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.ot summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted)}
.ot[open] summary{color:var(--ink)}
#refreshBtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.grantbox{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.seg{display:inline-flex;background:var(--surface2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;font-size:13px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.hball{border-top:1px solid var(--line);padding-top:10px;margin-top:14px}
.hl{flex:none;width:118px;font-size:13px;color:var(--muted)}
.wf{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.wfr{display:grid;grid-template-columns:150px 1fr 86px;gap:8px;align-items:center;font-size:13px}
.wfr.t{font-weight:700}
.wl{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wfr.t .wl{color:var(--ink)}
.wt{position:relative;height:16px;background:var(--surface2);border-radius:4px}
.wb{position:absolute;top:2px;bottom:2px;border-radius:3px}
.wt .z{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.wv{text-align:right;white-space:nowrap}
@media (max-width:600px){.wfr{grid-template-columns:104px 1fr 72px;font-size:12px}}
@media print{header.top nav,.hbtns,.x,.btn{display:none!important} header.top{position:static}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="logo"><div class="pole"></div><div><h1>Barber</h1><small id="subtitle">Καλαμάτα · επιχειρηματικό πλάνο</small></div></div>
      <div class="hbtns">
        <button class="ghost viewbtn" data-act="play" id="playBtn"></button>
        <button class="ghost viewbtn" data-act="view" id="viewBtn"></button>
        <button class="ghost" data-act="lock" id="lockBtn" title="Κλείδωμα αλλαγών"></button>

/* Έξοδα έναρξης: τεμάχια × τιμή τεμαχίου = ποσό. Παλιές εγγραφές χωρίς τεμάχια μετατρέπονται
   (π.χ. «Πολυθρόνες ×5» 3.250 € → 5 × 650 €). */
function normCapex(x) {
  if (x.unit == null || x.unit === '') {
    let q = +x.qty || 0;
    if (!q) {
      const m = String(x.name || '').match(/\s*[×xX]\s*(\d+)\s*$/) || String(x.name || '').match(/\s+(\d+)\s*τεμ(?:άχια|\.)?\s*$/) || String(x.name || '').match(/\s*\((\d+)\s*(?:μονάδες|τεμ(?:άχια|\.)?)\)\s*$/);
      if (m) { q = +m[1]; x.name = x.name.replace(m[0], ''); }
    }
    x.qty = q || 1;
    x.unit = Math.round((+x.amount || 0) / x.qty * 100) / 100;
  }
  x.qty = +x.qty || 0; x.unit = +x.unit || 0;
  x.amount = Math.round(x.qty * x.unit * 100) / 100;
  return x;
}
function hydrate(o) {

/* =========================================================
   FORMAT
   ========================================================= */
const fE = new Intl.NumberFormat('el-GR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const fE2 = new Intl.NumberFormat('el-GR', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fN = new Intl.NumberFormat('el-GR', { maximumFractionDigits: 0 });
const fN1 = new Intl.NumberFormat('el-GR', { maximumFractionDigits: 1 });
const eur = v => fE.format(Math.round(v) || 0);
const eur2 = v => fE2.format(v || 0);
const num = v => fN.format(v || 0);
const num1 = v => fN1.format(v || 0);
const sgn = v => v >= 0 ? 'pos' : 'neg';
const kEur = v => (Math.abs(v) >= 1000 ? (v / 1000).toFixed(Math.abs(v) >= 10000 ? 0 : 1).replace('.', ',') + 'k' : Math.round(v)) + ' €';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* =========================================================
   MODEL
   ========================================================= */
function avgTicket(s) {
  const tot = s.services.reduce((a, x) => a + (+x.mix || 0), 0);
  if (!tot) return 0;
  return s.services.reduce((a, x) => a + (+x.price || 0) * (+x.mix || 0), 0) / tot;
}

/* opt: k = πολλαπλασιαστής πελατείας (ramp-up), cpd = override κουρέματα/ημέρα, ticket = override μέση απόδειξη, mode = override μοντέλο */
// ωρομίσθιο από μηνιαίο μισθό: μισθός ÷ 25 × 6 ÷ 40 (= μισθός ÷ 166,67) × προσαύξηση υπερωρίας
// ώρες υπερωρίας/μήνα: είτε απευθείας ανά μήνα είτε ώρες/ημέρα × ημέρες με υπερωρία
const otMonthly = (b, st) => b.otUnit === 'day' ? (+b.otHoursDay || 0) * ((+b.otDays > 0) ? +b.otDays : st.daysPerMonth) : (+b.otHours || 0);
const otAutoRate = (b, st) => (+b.salary || 0) / 25 * 6 / 40 * (1 + (+st.overtimePremium || 0) / 100);
function compute(s, opt = {}) {
  const st = s.settings, k = opt.k ?? 1, yr = opt.y || 0;
  const gP = Math.pow(1 + (+st.priceGrowth || 0) / 100, yr), gW = Math.pow(1 + (+st.wageGrowth || 0) / 100, yr), gC = Math.pow(1 + (+st.costGrowth || 0) / 100, yr);
  const cpc = st.consumablePerCut * gC;
  const vS = 1 + st.vatServices / 100, vC = 1 + st.vatCoffee / 100, vP = 1 + st.vatProducts / 100;
  const er = 1 + st.employerRate / 100, sm = st.salaryMonths / 12;
  const card = (gross) => gross * st.cardShare / 100 * st.cardFee / 100;
  const at = avgTicket(s);
  const rev = { services: 0, chairRent: 0, coffee: 0, retail: 0 };
  const cost = { staff: 0, consum: 0, card: 0, barista: 0, coffee: 0, retail: 0, fixed: 0 };
  let clients = 0, shopCuts = 0, shopGross = 0, shopNet = 0, payrollBase = 0;

  const barbers = s.barbers.map(b => {
    const mode = (opt.mode && b.mode !== 'partner') ? opt.mode : b.mode;
    const cpd = opt.cpd ?? (+b.cutsPerDay || 0);
    // υπερωρίες: επιπλέον ώρες/μήνα × κουρέματα/ώρα (ακολουθούν τη σταδιακή πελατεία)
    const otHours = otMonthly(b, st) * k, otCuts = otHours * (+b.otCutsPerHour || 0);
    const cuts = cpd * k * st.daysPerMonth + otCuts;
    const ticket = opt.ticket ?? (((+b.ticket > 0) ? +b.ticket : at) * gP);
    const gross = cuts * ticket, net = gross / vS;
    const r = { name: b.name, mode, cuts, ticket, gross, net, shopRev: 0, staff: 0, consum: 0, card: 0, barberEarn: 0, barberNote: '', otHours, otCuts, otPay: 0, otGain: 0 };
    const otNet = otCuts * ticket / vS, otSide = otCuts * cpc + card(otCuts * ticket);
    clients += cuts;
    if (mode === 'rent') {
      r.shopRev = (+b.rent || 0) * gP;
      rev.chairRent += r.shopRev;
      r.barberEarn = net - r.shopRev - cuts * cpc;
      r.barberNote = 'πριν από δικό του ΕΦΚΑ & φόρο';
    } else {
      r.shopRev = net; rev.services += net;
      r.consum = cuts * cpc;
      r.card = card(gross);
      shopCuts += cuts; shopGross += gross; shopNet += net;
      if (mode === 'salary') {
        const base = (+b.salary || 0) * gW * sm;
        const bonus = net * (+b.bonusPct || 0) / 100;
        r.staff = (base + bonus) * er;
        payrollBase += base * er;
        r.barberEarn = base + bonus;
        if (otHours > 0) {
          const rate = (+b.otRate > 0 ? +b.otRate * gW : otAutoRate(b, st) * gW);
          r.otPay = otHours * rate;
          r.staff += r.otPay * er; r.barberEarn += r.otPay;
          r.otGain = otNet - r.otPay * er - otSide;
        }
        r.barberNote = `${num(+b.salary || 0)} € μικτά × ${num1(st.salaryMonths)} μισθοί (μαζί με δώρα & επίδομα αδείας) ÷ 12 = μέσος όρος μήνα${bonus > 0 ? ' + bonus' : ''}${r.otPay ? ' + υπερωρίες' : ''}. Κόστος για το μαγαζί με εισφορές: ${eur(r.staff)}`;
      } else if (mode === 'commission') {
        r.staff = net * (+b.barberPct || 0) / 100;
        r.otGain = otNet * (1 - (+b.barberPct || 0) / 100) - otSide;
        r.barberEarn = r.staff;
        r.barberNote = 'πριν από δικό του ΕΦΚΑ & φόρο';
      } else {
        r.otGain = otNet - otSide;
        r.barberNote = (+b.turnPct > 0) ? `${num1(b.turnPct)}% επί του τζίρου ${b.turnBase === 'own' ? 'των κουρεμάτων του' : 'όλου του μαγαζιού'} (χωρίς ΦΠΑ)` : 'αμείβεται από τα κέρδη';
      }
    }
    r.contrib = r.shopRev - r.staff - r.consum - r.card;
    cost.staff += r.staff; cost.consum += r.consum; cost.card += r.card;
    return r;
  });

  // μπαρίστα & καφές
  const ba = s.barista;
  let cups = 0, freeCups = 0, paidCups = 0, coffeeGross = 0;
  if (ba.enabled) { cost.barista = (+ba.salary || 0) * gW * sm * er * (+ba.fte || 0) / 100; payrollBase += cost.barista; }
  // free = κερασμένος στους πελάτες, paid = πωλείται, both = πωλείται + κερασμένος στους πελάτες του κουρείου
  if (ba.coffeeMode === 'free' || ba.coffeeMode === 'both') freeCups = clients * (ba.freeAll ? 100 : (+ba.takeRate || 0)) / 100;
  if (ba.coffeeMode === 'paid' || ba.coffeeMode === 'both') {
    paidCups = (+ba.cupsPerDay || 0) * k * st.daysPerMonth;
    coffeeGross = paidCups * (+ba.price || 0) * gP;
    rev.coffee = coffeeGross / vC;
    cost.card += card(coffeeGross);
  }
  cups = freeCups + paidCups;
  cost.coffee = cups * (+ba.costPerCup || 0) * gC;

  // λιανική
  const rg = (+s.retail.sales || 0) * k * gP;
  rev.retail = rg / vP;
  cost.retail = rev.retail * (1 - (+s.retail.margin || 0) / 100);
  cost.card += card(rg);

  cost.fixed = s.fixed.reduce((a, x) => a + (+x.amount || 0), 0) * gC;

  const revenue = rev.services + rev.chairRent + rev.coffee + rev.retail;
  // εταίροι με ποσοστό επί του τζίρου (π.χ. Πάνος 15%) — καθαρός τζίρος χωρίς ΦΠΑ
  cost.partner = 0;
  barbers.forEach((r, i) => {
    const b = s.barbers[i];
    if (r.mode !== 'partner' || !(+b.turnPct > 0)) return;
    const fee = (b.turnBase === 'own' ? r.net : revenue) * (+b.turnPct) / 100;
    r.partnerFee = fee; r.barberEarn = fee; r.contrib -= fee; cost.partner += fee;
  });

  const preTax = revenue - costs;
  const tax = Math.max(0, preTax) * st.corpTax / 100;
  const net = preTax - tax;
  const dist = net > 0 ? net * (1 - st.dividendTax / 100) : net;
  const grossReceipts = shopGross + coffeeGross + rg;
  return { barbers, rev, cost, revenue, costs, preTax, tax, net, dist, clients, shopCuts, shopGross, shopNet, cups, freeCups, paidCups, payrollBase, grossReceipts, avgTicket: at };
}

function capexTotals(s, R) {
  const cats = {};
  let items = 0;
  s.capex.forEach(x => { cats[x.cat] = cats[x.cat] || 0; if (x.on) { cats[x.cat] += +x.amount || 0; items += +x.amount || 0; } });
  const contingency = items * s.settings.contingencyPct / 100;
  const reserve = s.settings.reserveMonths * (R.cost.fixed + R.payrollBase);
  return { cats, items, contingency, reserve, spend: items + contingency, total: items + contingency + reserve };
}

function rampK(s, m) {
  const st = s.settings, r = Math.max(0, st.rampMonths | 0), a = st.rampStart / 100;
  if (r <= 0) return 1;
  return Math.min(1, a + (1 - a) * (m - 1) / r);
}

function loanPlan(F) {
  const L = Math.max(0, +F.loan || 0), N = Math.max(1, Math.round((+F.years || 0) * 12)), r = (+F.rate || 0) / 1200;
  const pay = L <= 0 ? 0 : r > 0 ? L * r / (1 - Math.pow(1 + r, -N)) : L / N;
  return { L, N, r, pay };
}
/* Μήνας-μήνας: σταδιακή πελατεία, ετήσιες αυξήσεις, τόκοι (εκπίπτουν) και δόσεις δανείου, επιδότηση. */
function cashflow(s, C) {
  const st = s.settings, H = Math.max(12, st.horizon | 0), F = s.finance || {}, lp = loanPlan(F);
  const cum = [], monthly = [], years = [];
  const start = -Math.max(0, C.spend - lp.L);
  let c = start, bal = lp.L, payback = null, min = c;
  for (let m = 1; m <= H; m++) {
    const y = Math.floor((m - 1) / 12);
    const R = compute(s, { k: rampK(s, m), y });
    const interest = bal * lp.r;
    const principal = (m <= lp.N && bal > 0) ? Math.min(bal, lp.pay - interest) : 0;
    bal -= principal;
    const preTax = R.preTax - interest;
    const tax = Math.max(0, preTax) * st.corpTax / 100;
    const net = preTax - tax;
    const gOn = !!F.grantOn && +F.grant > 0, gm = +F.grantMonth || 1;
    const grant = (gOn && m === gm) ? +F.grant : 0;
    // επιστρεπτέα επιδότηση: ίσες μηνιαίες δόσεις χωρίς τόκο, μετά την περίοδο χάριτος
    const gN = Math.max(1, Math.round((+F.grantRepayYears || 0) * 12)), gStart = gm + Math.max(0, +F.grantGrace || 0) + 1;
    const grantRepay = (gOn && F.grantNonRepay === false && m >= gStart && m < gStart + gN) ? +F.grant / gN : 0;
    const cash = net - principal + grant - grantRepay;
    c += cash; cum.push(c); monthly.push(cash);
    if (c < min) min = c;
    if (payback === null && c >= 0 && start < 0) payback = m;
    const Y = years[y] = years[y] || { rev: 0, gross: 0, costs: 0, preTax: 0, tax: 0, net: 0, loan: 0, grant: 0, grantRepay: 0, cash: 0, clients: 0 };
    Y.grantRepay += grantRepay;
    Y.rev += R.revenue; Y.gross += R.grossReceipts; Y.costs += R.costs + interest; Y.preTax += preTax; Y.tax += tax; Y.net += net;
    Y.loan += interest + principal; Y.grant += grant; Y.cash += cash; Y.clients += R.clients; Y.end = c;
  }
  return { start, cum, monthly, years, payback, min, loan: lp, H };
}

function breakeven(s) {
  const p0 = compute(s, { k: 0 }).preTax, p1 = compute(s, { k: 1 }).preTax;
  const work = s.barbers.filter(b => b.mode !== 'rent');
  const avg = work.length ? work.reduce((a, b) => a + (+b.cutsPerDay || 0), 0) / work.length : 0;
  if (p1 <= p0 || !work.length) return { k: null, cpd: null, avg };
  const kk = -p0 / (p1 - p0);
  return { k: kk, cpd: kk * avg, avg, clientsMonth: kk * avg * work.length * s.settings.daysPerMonth };
}

function scaleY(vals, H, P, zero = true) {

const OT_KEYS = ['cutsPerDay', 'otHours', 'otUnit', 'otHoursDay', 'otDays', 'otCutsPerHour'];
function bridgeSteps(B, T) {
  const steps = [
    ['Κουρέματα & υπερωρίες', s => s.barbers.forEach(b => { const t = T.barbers.find(x => x.name === b.name); if (t) OT_KEYS.forEach(k => { b[k] = t[k]; }); })],
    ['Τιμές', s => { s.services = clone(T.services); s.barbers.forEach(b => { const t = T.barbers.find(x => x.name === b.name); if (t) b.ticket = t.ticket; }); }],
    ['Μισθοί, συμφωνίες, άτομα', s => { s.barbers = clone(T.barbers); s.partners = clone(T.partners); }],
    ['Πάγια', s => { s.fixed = clone(T.fixed); }],
    ['Καφές & μπαρίστα', s => { s.barista = clone(T.barista); }],
    ['Προϊόντα', s => { s.retail = clone(T.retail); }],
    ['Παραδοχές & λοιπά', s => { Object.assign(s, clone(T)); }]

}

  const color = { tot: 'var(--c8)', tot2: 'var(--accent)', up: 'var(--pos)', down: 'var(--neg)' };
  return `<div class="wf">${rows.map(r => {
    const a = Math.min(r.from, r.to), b = Math.max(r.from, r.to);
    const txt = r.kind.startsWith('tot') ? eur(r.to) : `${r.delta >= 0 ? '+' : '−'}${eur(Math.abs(r.delta))}`;
    return `<div class="wfr${r.kind.startsWith('tot') ? ' t' : ''}" data-tip="${attr(tipHTML(esc(r.label), [['', r.kind.startsWith('tot') ? 'Καθαρό/μήνα' : 'Αλλαγή στο καθαρό/μήνα', txt]]))}"><span class="wl">${esc(r.label)}</span><div class="wt">${lo < 0 ? `<i class="z" style="left:${pos(0)}%"></i>` : ''}<div class="wb" style="left:${pos(a)}%;width:${Math.max(0.6, pos(b) - pos(a))}%;background:${color[r.kind]}"></div></div><span class="wv ${r.kind === 'up' ? 'pos' : r.kind === 'down' ? 'neg' : ''}">${txt}</span></div>`;
  }).join('')}</div>`;
}
function fBridge() {
  const box = $('ov-bridge'); if (!box) return;
  const to = VIEW === 'play' ? cur('play') : cur('target');
  const card = box.closest('.card');
  if (!to) { card.style.display = 'none'; return; }
  card.style.display = '';
  const B = cur('base'), toName = VIEW === 'play' ? 'Παίξε' : 'Στόχος';
  $('ov-bridge-title').textContent = `Από τα τωρινά ${VIEW === 'play' ? 'στο «Παίξε»' : 'στον Στόχο'}`;
  // σωρευτικό ταμείο: δύο γραμμές
  const cB = cashflow(B, capexTotals(B, compute(B))), cT = cashflow(to, capexTotals(to, compute(to)));
  const H = Math.min(cB.H, cT.H), vB = [cB.start, ...cB.cum.slice(0, H)], vT = [cT.start, ...cT.cum.slice(0, H)];
  const w = cw('ov-bridge-cash'), step = w < 600 ? 12 : 6, ticks = []; for (let i = 0; i <= H; i += step) ticks.push(i);
  const ser = [{ name: 'Τωρινά', color: 'var(--c8)', values: vB, dash: true }, { name: toName, color: 'var(--accent)', values: vT }];
  box.innerHTML = `<p class="small" style="margin-top:-6px">Πώς αλλάζει το καθαρό κέρδος/μήνα, βήμα-βήμα, από τα τωρινά νούμερα ${VIEW === 'play' ? 'σε αυτά που παίζεις' : 'στον Στόχο'}.</p>` + bridgeHTML(B, to, toName);
  setHTML('ov-bridge-cash', legend(ser.map(x => [x.color, x.name, x.dash ? 'dash' : ''])) + lineChart({
    w, n: H + 1, series: ser, ticks, xLabel: i => i === 0 ? (w < 600 ? '0' : 'Έναρξη') : i + 'ος', label: 'Σωρευτικό ταμείο: τωρινά και ' + toName,
    marks: [cT.payback && cT.payback <= H ? { i: cT.payback, v: vT[cT.payback], label: `${toName}: απόσβεση μήνας ${cT.payback}` } : null].filter(Boolean),
    tip: i => tipHTML(i === 0 ? 'Έναρξη' : monthName(i), [['var(--c8)', 'Τωρινά', eur(vB[i])], ['var(--accent)', toName, eur(vT[i])], ['', 'Διαφορά', eur(vT[i] - vB[i])]])
  }) + `<p class="small">Απόσβεση: τωρινά ${cB.payback ? cB.payback + 'ος μήνας' : '> ' + cB.H + ' μήνες'} · ${toName} ${cT.payback ? cT.payback + 'ος μήνας' : '> ' + cT.H + ' μήνες'}.</p>`);
}

function fOverview(R) {
  const C = capexTotals(S, R), CF = cashflow(S, C), BE = breakeven(S);
  const st = S.settings, lp = CF.loan;
  const own = Math.max(0, C.total - lp.L);
  setHTML('ov-kpis', [
    ['Τζίρος/μήνα (με ΦΠΑ)', eur(R.grossReceipts + R.rev.chairRent * (1 + st.vatServices / 100)), `${num(R.clients)} πελάτες`],
    ['Κέρδος προ φόρων', `<span class="${sgn(R.preTax)}">${eur(R.preTax)}</span>`, `${eur(R.preTax * 12)} / έτος`],
    ['Καθαρό μετά φόρων', `<span class="${sgn(R.net)}">${eur(R.net)}</span>`, `${eur(R.net * 12)} / έτος`],
    ['Απαιτούμενο κεφάλαιο', eur(C.total), lp.L ? `εταίροι ${eur(own)} · δάνειο ${eur(lp.L)}` : `έξοδα ${eur(C.spend)} + αποθεματικό ${eur(C.reserve)}`],
    ['Απόσβεση', CF.payback ? `${CF.payback} μήνες` : `> ${CF.H} μήνες`, CF.payback ? `με σταδιακή εκκίνηση ${st.rampMonths} μηνών` : 'δεν αποσβένεται στο διάστημα'],
    ['Νεκρό σημείο', BE.cpd != null ? `${num1(BE.cpd)} κουρ./ημέρα` : '—', BE.cpd != null ? `ανά κουρέα (σήμερα ${num1(BE.avg)})` : 'δεν υπάρχουν μισθωτοί/ποσοστό']
  ].map(([l, v, e]) => `<div class="card kpi"><span>${l}</span><b>${v}</b><em>${e}</em></div>`).join(''));

  setHTML('ov-ticket', `Μέση απόδειξη <b>${eur2(R.avgTicket)}</b> με ΦΠΑ (${eur2(R.avgTicket / (1 + st.vatServices / 100))} καθαρά), με βάση το μείγμα υπηρεσιών. Αλλάζεις μείγμα στην καρτέλα «Κουρείς & τιμές».`);

  const r = R.rev, c = R.cost;
  setHTML('ov-pl',
    row('Κουρέματα (μισθωτοί, ποσοστό, εταίροι)', eur(r.services)) +
    (r.chairRent ? row('Ενοίκια θέσεων', eur(r.chairRent)) : '') +
    (r.coffee ? row('Πωλήσεις καφέ', eur(r.coffee)) : '') +
    (r.retail ? row('Πωλήσεις προϊόντων', eur(r.retail)) : '') +
    row('Σύνολο εσόδων', eur(R.revenue), 'sub') +
    row('Μισθοί & αμοιβές κουρέων', '−' + eur(c.staff)) +
    (c.partner ? row(`Αμοιβή εταίρων επί τζίρου (${R.barbers.filter(b => b.partnerFee).map(b => esc(b.name)).join(', ')})`, '−' + eur(c.partner)) : '') +
    (c.barista ? row('Μπαρίστα (με εισφορές)', '−' + eur(c.barista)) : '') +
    row('Πάγια (ενοίκιο, ρεύμα, λογιστής…)', '−' + eur(c.fixed)) +
    row('Αναλώσιμα κουρείου', '−' + eur(c.consum)) +
    (c.coffee ? row('Πρώτη ύλη καφέ', '−' + eur(c.coffee)) : '') +
    (c.retail ? row('Κόστος προϊόντων', '−' + eur(c.retail)) : '') +
    row('Προμήθειες καρτών', '−' + eur(c.card)) +
    row('Κέρδος προ φόρων', `<span class="${sgn(R.preTax)}">${eur(R.preTax)}</span>`, 'sub') +
    row(`Φόρος εταιρείας ${st.corpTax}%`, '−' + eur(R.tax)) +
    row('Καθαρό κέρδος', `<span class="${sgn(R.net)}">${eur(R.net)}</span>`, 'tot') +
    (lp.pay ? row(`Δόση δανείου (${num(lp.L)} € / ${num1(lp.N / 12)} έτη)`, '−' + eur(lp.pay)) + row('Μένει μετά τη δόση', `<span class="${sgn(R.net - lp.pay)}">${eur(R.net - lp.pay)}</span>`, 'sub') : '') +
    row(`Προς διανομή (μετά φόρο μερισμάτων ${st.dividendTax}%)`, eur(Math.max(0, R.net - lp.pay) * (1 - st.dividendTax / 100))));

  // cashflow line
  setHTML('ov-cf-sub', `Ξεκινά από ${eur(CF.start)} (έξοδα έναρξης + απρόβλεπτα${lp.L ? ' − δάνειο' : ''}). Πρώτος μήνας στο ${st.rampStart}% της πελατείας, πλήρης μετά από ${st.rampMonths} μήνες· τιμές +${num1(st.priceGrowth)}%, μισθοί +${num1(st.wageGrowth)}%, πάγια +${num1(st.costGrowth)}% τον χρόνο. ` +
    `Χαμηλότερο σημείο: <b>${eur(CF.min)}</b>. ` + (CF.payback ? `Τα λεφτά επιστρέφουν τον <b>${CF.payback}ο μήνα</b>.` : `<b class="neg">Δεν επιστρέφουν μέσα σε ${CF.H} μήνες.</b>`) +
    (-CF.min > -CF.start + C.reserve ? ` <b class="neg">Το ταμείο πέφτει ${eur(-CF.min + CF.start)} κάτω από την αρχική επένδυση — το αποθεματικό των ${eur(C.reserve)} δεν φτάνει.</b>` : ''));
  const w = cw('ov-cf'), narrow = w < 600, H = CF.H;
  const vals = [CF.start, ...CF.cum];
  const step = narrow ? 12 : 6, ticks = [];
  for (let i = 0; i <= H; i += step) ticks.push(i);
  setHTML('ov-cf', lineChart({
    w, n: H + 1, label: 'Σωρευτικό ταμείο εταίρων ανά μήνα', area: true,
    series: [{ name: 'Ταμείο', color: 'var(--accent)', values: vals }],
    ticks, xLabel: i => i === 0 ? (w < 600 ? '0' : 'Έναρξη') : i + 'ος',
    marks: CF.payback ? [{ i: CF.payback, v: vals[CF.payback], label: `απόσβεση · μήνας ${CF.payback}` }] : [],
    tip: i => tipHTML(i === 0 ? 'Έναρξη' : monthName(i), [['var(--accent)', 'Σωρευτικά', eur(vals[i])]].concat(i ? [['', 'Αυτόν τον μήνα', eur(CF.monthly[i - 1])], ['', 'Πελατεία', num(rampK(S, i) * 100) + '%']] : []))
  }));
  const mt = []; for (let i = 0; i < H; i += step) mt.push(i);
  setHTML('ov-mb', barChart({
    w, values: CF.monthly, ticks: mt, xLabel: i => (i + 1) + 'ος', label: 'Ταμειακό αποτέλεσμα ανά μήνα',
    tip: i => tipHTML(monthName(i + 1), [[CF.monthly[i] >= 0 ? 'var(--pos)' : 'var(--neg)', 'Αποτέλεσμα', eur(CF.monthly[i])], ['', 'Πελατεία', num(rampK(S, i + 1) * 100) + '%']])
  }));
  const Y = CF.years;
  setHTML('ov-years', `<table class="tbl yrs"><tr><th></th>${Y.map((_, i) => `<th>${i + 1}ο έτος</th>`).join('')}</tr>
    <tr><td>Πελάτες</td>${Y.map(y => `<td>${num(y.clients)}</td>`).join('')}</tr>
    <tr><td>Τζίρος (με ΦΠΑ)</td>${Y.map(y => `<td>${eur(y.gross)}</td>`).join('')}</tr>
    <tr><td>Έσοδα</td>${Y.map(y => `<td>${eur(y.rev)}</td>`).join('')}</tr>
    <tr><td>Έξοδα</td>${Y.map(y => `<td>−${eur(y.costs)}</td>`).join('')}</tr>
    <tr><td>Φόρος</td>${Y.map(y => `<td>−${eur(y.tax)}</td>`).join('')}</tr>
    <tr style="font-weight:700"><td>Καθαρό κέρδος</td>${Y.map(y => `<td class="${sgn(y.net)}">${eur(y.net)}</td>`).join('')}</tr>
    ${lp.L ? `<tr><td>Δόσεις δανείου</td>${Y.map(y => `<td>−${eur(y.loan)}</td>`).join('')}</tr>` : ''}
    ${Y.some(y => y.grant) ? `<tr><td>Επιδότηση${S.finance.grantNonRepay === false ? '' : ' (δεν επιστρέφεται)'}</td>${Y.map(y => `<td>${y.grant ? eur(y.grant) : '—'}</td>`).join('')}</tr>` : ''}
    ${Y.some(y => y.grantRepay) ? `<tr><td>Επιστροφή επιδότησης</td>${Y.map(y => `<td>${y.grantRepay ? '−' + eur(y.grantRepay) : '—'}</td>`).join('')}</tr>` : ''}
    <tr><td>Ταμείο τέλος έτους</td>${Y.map(y => `<td class="${sgn(y.end)}">${eur(y.end)}</td>`).join('')}</tr></table>`);

  // donut: where revenue goes
  const dParts = [
    { name: 'Κουρείς (μισθοί/ποσοστά)', value: c.staff, color: SER[0] },
    { name: 'Πάγια', value: c.fixed, color: SER[1] },
    { name: 'Μπαρίστα', value: c.barista, color: SER[2] },
    { name: 'Εταίροι (% τζίρου)', value: c.partner || 0, color: SER[4] },
    { name: 'Αναλώσιμα, καφές, προϊόντα', value: c.consum + c.coffee + c.retail, color: SER[3] },
    { name: 'Προμήθειες καρτών', value: c.card, color: SER[7] },
    { name: 'Φόρος', value: R.tax, color: SER[6] },
    { name: R.net >= 0 ? 'Καθαρό κέρδος' : 'Ζημιά', value: Math.max(0, R.net), color: SER[5] }
  ].filter(p => p.value > 0.5);
  setHTML('ov-donut', `<p class="small" style="margin-top:-6px">Από τα ${eur(R.revenue)} εσόδων του μήνα (χωρίς ΦΠΑ).</p>` + donutBlock(dParts, { big: eur(R.revenue), small: 'έσοδα/μήνα' }));

  setHTML('ov-workers', workersChart(R, true));
  fBridge();
  // per-cut
  if (R.shopCuts > 0) {
    const n = R.shopCuts, g = R.shopGross / n;
    const vat = (R.shopGross - R.shopNet) / n;
    const staff = c.staff / n, cons = c.consum / n;
    const cardc = R.barbers.reduce((a, b) => a + b.card, 0) / n;
    const tax = R.tax / n, prof = R.net / n;
    const over = g - vat - staff - cons - cardc - tax - prof;
    const parts = [
      ['ΦΠΑ', vat, SER[7]], ['Κουρέας (μισθός/ποσοστό)', staff, SER[0]], ['Ενοίκιο, μπαρίστα, πάγια', over, SER[1]],
      ['Αναλώσιμα & POS', cons + cardc, SER[3]], ['Φόρος', tax, SER[6]], [prof >= 0 ? 'Κέρδος' : 'Ζημιά', prof, SER[5]]
    ];
    const tot = parts.reduce((a, p) => a + Math.max(0, p[1]), 0) || 1;
    setHTML('ov-cut', `<p class="small" style="margin-top:-6px">Μέση απόδειξη ${eur2(g)} — από κουρέματα που εισπράττει το μαγαζί.</p>
      <div class="stack">${parts.filter(p => p[1] > 0).map(p => `<div style="width:${p[1] / tot * 100}%;background:${p[2]};border-right:2px solid var(--surface)" data-tip="${attr(tipHTML(p[0], [[p[2], 'Ανά κούρεμα', eur2(p[1])], ['', 'Μερίδιο', num(p[1] / g * 100) + '%']]))}"></div>`).join('')}</div>
      <div class="legend">${parts.map(p => `<div class="row"><span><i class="dot" style="background:${p[2]}"></i>${p[0]}</span><span class="${p[1] < 0 ? 'neg' : ''}">${eur2(p[1])}</span></div>`).join('')}</div>`);
  } else setHTML('ov-cut', '<p class="small">Όλοι οι κουρείς είναι σε ενοικίαση θέσης — το μαγαζί δεν εισπράττει κουρέματα.</p>');

  // models
  const ms = ['salary', 'commission', 'rent'].map(m => ({ m, R: compute(S, { mode: m }) }));
  const best = ms.reduce((a, b) => b.R.net > a.R.net ? b : a);
  setHTML('ov-models', ms.map(({ m, R: x }) => {
    const C2 = capexTotals(S, x);
    return `<div class="model ${m === best.m ? 'best' : ''}"><span class="small"><i class="dot" style="background:${MODE_SER[m][0]};margin-right:6px"></i>${MODE_SER[m][1]}</span><b class="${sgn(x.net)}">${eur(x.net)}</b><span class="small">καθαρό/μήνα · αποθεματικό ${eur(C2.reserve)}</span></div>`;
  }).join(''));
  const cps = []; for (let v = 4; v <= 18; v++) cps.push(v);
  const mser = ['salary', 'commission', 'rent'].map(m => ({ name: MODE_SER[m][1], color: MODE_SER[m][0], values: cps.map(v => compute(S, { mode: m, cpd: v }).net) }));
  const mw = cw('ov-mline');
  setHTML('ov-mline', legend(mser.map(sr => [sr.color, sr.name])) + lineChart({
    w: mw, n: cps.length, label: 'Καθαρό κέρδος ανά μοντέλο και κουρέματα/ημέρα', series: mser,
    ticks: cps.map((_, i) => i).filter(i => i % 2 === 0), xLabel: i => String(cps[i]),
    vline: BE.avg >= 4 && BE.avg <= 18 ? { at: BE.avg - 4, label: `σήμερα ${num1(BE.avg)}` } : null,
    tip: i => tipHTML(`${cps[i]} κουρέματα/ημέρα ανά κουρέα`, mser.map(sr => [sr.color, sr.name, eur(sr.values[i])]))
  }));
  // crossover salary vs commission
  let cross = null;
  for (let i = 1; i < cps.length; i++) { const a = mser[0].values[i - 1] - mser[1].values[i - 1], b = mser[0].values[i] - mser[1].values[i]; if (a < 0 && b >= 0) { cross = cps[i - 1] + a / (a - b); break; } }
  const avgB = S.barbers.filter(b => b.mode !== 'partner');
  const rentAvg = avgB.length ? avgB.reduce((a, b) => a + (+b.rent || 0), 0) / avgB.length : 0;
  const pctAvg = avgB.length ? avgB.reduce((a, b) => a + (+b.barberPct || 0), 0) / avgB.length : 0;
  setHTML('ov-models-note', `Ενοίκιο θέσης ~${eur(rentAvg)}/μήνα, ποσοστό κουρέα ~${num(pctAvg)}%. ` +
    (cross ? `<b>Οι μισθωτοί συμφέρουν από ~${num1(cross)} κουρέματα/ημέρα και πάνω</b>· κάτω από αυτό συμφέρει το ποσοστό. ` : '') +
    `Μισθωτοί = μεγαλύτερο κέρδος όταν κουρεύουν πολύ, αλλά σταθερό κόστος όταν το μαγαζί είναι άδειο. Ενοικίαση = μικρό αλλά σίγουρο έσοδο.`);

  // heat
  const rows = [6, 8, 10, 12, 14, 16], cols = [12, 14, 16, 18, 20, 22];
  const hv = rows.map(rr => cols.map(t => compute(S, { cpd: rr, ticket: t }).net));
  const mx = Math.max(1, ...hv.flat().map(Math.abs));
  const curR = rows.reduce((a, b) => Math.abs(b - BE.avg) < Math.abs(a - BE.avg) ? b : a);
  const curC = cols.reduce((a, b) => Math.abs(b - R.avgTicket) < Math.abs(a - R.avgTicket) ? b : a);
  setHTML('ov-heat', `<table class="heat"><tr><th>κουρ./ημέρα</th>${cols.map(cc => `<th>${cc} €</th>`).join('')}</tr>${rows.map((rr, i) => `<tr><th>${rr}</th>${cols.map((cc, j) => {
    const v = hv[i][j], a = Math.min(1, Math.abs(v) / mx) * 0.85 + 0.08;
    const bg = v >= 0 ? `color-mix(in srgb,var(--pos) ${a * 100}%,var(--surface))` : `color-mix(in srgb,var(--neg) ${a * 100}%,var(--surface))`;
    const fg = a > 0.5 ? '#fff' : 'var(--ink)';
    return `<td style="background:${bg};color:${fg}" class="${rr === curR && cc === curC ? 'cur' : ''}" data-tip="${attr(tipHTML(`${rr} κουρ./ημέρα × ${cc} €`, [['', 'Καθαρό/μήνα', eur(v)], ['', 'Καθαρό/έτος', eur(v * 12)]]))}">${kEur(v)}</td>`;
  }).join('')}</tr>`).join('')}</table><p class="small">Περίγραμμα = πιο κοντά στα σημερινά νούμερα.</p>`);
}

function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }

/* ---------- Ελάχιστα: τι χρειάζεται για να μη μπαίνει μέσα το μαγαζί ---------- */
// μικρότερο x στο [lo,hi] με f(x) >= 0 (f αύξουσα). null αν δεν φτάνει ούτε στο hi.
function solveMin(f, lo, hi, it = 40) {
  if (f(hi) < 0) return null;
  if (f(lo) >= 0) return lo;
  for (let k = 0; k < it; k++) { const m = (lo + hi) / 2; if (f(m) >= 0) hi = m; else lo = m; }
  return hi;
}
// μεγαλύτερο x στο [lo,hi] με f(x) >= 0 (f φθίνουσα)
function solveMax(f, lo, hi, it = 40) {
  if (f(lo) < 0) return null;
  if (f(hi) >= 0) return hi;
  for (let k = 0; k < it; k++) { const m = (lo + hi) / 2; if (f(m) >= 0) lo = m; else hi = m; }
  return lo;
}
const withS = (mut) => { const s = clone(S); mut(s); return s; };

function minCard(title, min, now, fmt, opts = {}) {
  const ok = min == null ? false : (opts.max ? now <= min : now >= min);
  const reach = min == null;
  const margin = !reach && now ? (opts.max ? (min - now) / min : (now - min) / now) : null;
  const pct = reach ? 0 : Math.max(0, Math.min(100, opts.max ? (now / (min || 1)) * 100 : ((min || 0) / (now || 1)) * 100));
  return `<div class="card mn ${reach ? 'bad' : ok ? 'ok' : 'bad'}">
    <span class="small">${title}</span>
    <b class="big">${reach ? 'δεν φτάνει' : fmt(min)}</b>
    <div class="mnbar"><div style="width:${Math.min(100, pct)}%"></div></div>
    <span class="small">σήμερα <b>${fmt(now)}</b>${margin != null ? ` · ${ok ? 'περιθώριο' : 'λείπουν'} ${num(Math.abs(margin) * 100)}%` : ''}</span>
    ${opts.note ? `<span class="small" style="display:block;margin-top:4px">${opts.note}</span>` : ''}
  </div>`;
}
function fMinimums(R) {
  const goal = +S.settings.goalNet || 0;

  const days = S.settings.daysPerMonth;

  // 1. κουρέματα/ημέρα ανά κουρέα (όλοι ίδια)
  const cpd = solveMin(x => g(withS(s => s.barbers.forEach(b => { if (b.mode !== 'rent') b.cutsPerDay = x; }))), 0, 40);
  const cards = [];

  // 2. πελάτες/μήνα
  const rentCuts = S.barbers.filter(b => b.mode === 'rent').reduce((a, b) => a + (+b.cutsPerDay || 0) * days, 0);
  cards.push(minCard('Πελάτες/μήνα (όλο το μαγαζί)', cpd == null ? null : cpd * days * work.length + rentCuts, R.clients, v => num(v), { note: `≈ ${cpd == null ? '—' : num((cpd * work.length * days + rentCuts) / days)} την ημέρα` }));
  // 3. τζίρος με ΦΠΑ
  const turnAt = cpd == null ? null : compute(withS(s => s.barbers.forEach(b => { if (b.mode !== 'rent') b.cutsPerDay = cpd; }))).grossReceipts;
  cards.push(minCard('Τζίρος/μήνα (με ΦΠΑ)', turnAt, R.grossReceipts, v => eur(v)));
  // 4. μέση τιμή
  const scaleS = f => withS(s => { s.services.forEach(x => { x.price = (+x.price || 0) * f; }); s.barbers.forEach(b => { if (+b.ticket > 0) b.ticket = +b.ticket * f; }); });
  const fMin = solveMin(f => g(scaleS(f)), 0, 5);
  cards.push(minCard('Μέση απόδειξη κουρέματος (με ΦΠΑ)', fMin == null ? null : R.avgTicket * fMin, R.avgTicket, v => eur2(v)));
  // 5. καφέδες
  if (S.barista.coffeeMode === 'paid' || S.barista.coffeeMode === 'both') {
    const cups = solveMin(x => g(withS(s => { s.barista.cupsPerDay = x; })), 0, 1000);
    cards.push(minCard('Καφέδες που πωλούνται/ημέρα', cups, +S.barista.cupsPerDay || 0, v => num(v), { note: `στα ${eur2(S.barista.price)} ο καφές` }));
  }
  // 6. μέγιστο ενοίκιο
  const ri = S.fixed.findIndex(x => /ενοίκ/i.test(x.name));
  if (ri >= 0) {
    const maxRent = solveMax(x => g(withS(s => { s.fixed[ri].amount = x; })), 0, 20000);
    cards.push(minCard('Μέγιστο ενοίκιο που αντέχει', maxRent, +S.fixed[ri].amount || 0, v => eur(v), { max: true, note: `«${esc(S.fixed[ri].name)}»` }));
  }
  // 7. μέγιστος μισθός
  const sal = S.barbers.filter(b => b.mode === 'salary');
  if (sal.length) {
    const avgSal = sal.reduce((a, b) => a + (+b.salary || 0), 0) / sal.length;
    const maxSal = solveMax(x => g(withS(s => s.barbers.forEach(b => { if (b.mode === 'salary') b.salary = x; }))), 0, 10000);
    cards.push(minCard('Μέγιστος μικτός μισθός κουρέα', maxSal, avgSal, v => eur(v), { max: true, note: `ίδιος για τους ${sal.length} μισθωτούς` }));
  }
  setHTML('mn-cards', cards.join(''));

  // διαγράμματα
  const refs = goal ? [{ y: goal, color: 'var(--accent)' }] : [];
  const goalTxt = goal ? 'στόχος' : 'όριο';
  const sens = (id, xs, mk, opts) => {

    const minX = opts.min, nowX = opts.now;

      w, n, label: opts.label, series: [{ name: 'Καθαρό/μήνα', color: 'var(--c1)', values: vals }], refs,
      ticks, xLabel: i => opts.fmtX(xs[i]),

      marks: minX != null && minX > xs[0] && minX <= xs[n - 1] ? [{ i: at(minX), v: goal, label: `${goalTxt} ${opts.fmtX(minX)}` }] : [],
      tip: i => tipHTML(opts.tipTitle(xs[i]), [['var(--c1)', 'Καθαρό/μήνα', eur(vals[i])], ['', 'Καθαρό/έτος', eur(vals[i] * 12)]])
    }));
  };
  const cx = []; for (let x = 0; x <= Math.max(20, Math.ceil(avgCpd) + 4); x++) cx.push(x);
  sens('mn-ch-cuts', cx, x => withS(s => s.barbers.forEach(b => { if (b.mode !== 'rent') b.cutsPerDay = x; })),
    { label: 'Καθαρό ανά κουρέματα/ημέρα', min: cpd, now: avgCpd, fmtX: v => num1(v), tipTitle: x => `${x} κουρέματα/ημέρα ανά κουρέα`, tickEvery: cx.length > 22 || cw('mn-ch-cuts') < 600 ? 4 : 2 });
  const at0 = R.avgTicket || 1, px = []; for (let x = 6; x <= 26; x++) px.push(x);
  sens('mn-ch-price', px, x => scaleS(x / at0), { label: 'Καθαρό ανά μέση τιμή', min: fMin == null ? null : at0 * fMin, now: at0, fmtX: v => num1(v) + '€', tipTitle: x => `Μέση απόδειξη ${x} €` });
  const sold = S.barista.coffeeMode === 'paid' || S.barista.coffeeMode === 'both';

  }

  // ελάχιστες τιμές ανά υπηρεσία
  setHTML('mn-prices', fMin == null ? '<p class="small neg">Ακόμα και με 5πλάσιες τιμές δεν βγαίνει — το πρόβλημα είναι τα έξοδα ή τα κουρέματα.</p>' :
    `<table class="tbl"><tr><th>Υπηρεσία</th><th class="num">Σήμερα</th><th class="num">Τουλάχιστον</th></tr>${S.services.map(x => `<tr><td>${esc(x.name)}</td><td class="num">${eur2(x.price)}</td><td class="num ${fMin > 1 ? 'neg' : 'pos'}">${eur2(Math.ceil(x.price * fMin * 2) / 2)}</td></tr>`).join('')}</table>

/* =========================================================
   SCENARIOS
   ========================================================= */
function scenarios() { try { return JSON.parse(ls.get(LS_SCN)) || {}; } catch (e) { return {}; } }

/* =========================================================
   CSV IMPORT / EXPORT
   Columns: section,category,name,field,value,note
   Sections listed in the file replace that whole list
   (capex, fixed, service, barber, partner); setting, barista
   and retail rows update single values.
   ========================================================= */
const CSV_COLS = ['section', 'category', 'name', 'field', 'value', 'note'];
const LIST_SECTIONS = { capex: 'Έξοδα έναρξης', fixed: 'Μηνιαία πάγια', service: 'Υπηρεσίες', barber: 'Κουρείς', partner: 'Εταίροι' };
const MODE_ALIASES = { salary: 'salary', 'μισθωτός': 'salary', 'μισθωτος': 'salary', 'μισθός': 'salary', commission: 'commission', 'ποσοστό': 'commission', 'ποσοστο': 'commission', rent: 'rent', 'ενοικίαση': 'rent', 'ενοικιαση': 'rent', 'ενοικίαση θέσης': 'rent', partner: 'partner', 'εταίρος': 'partner', 'εταιρος': 'partner' };
const COFFEE_ALIASES = { free: 'free', 'κερασμένος': 'free', paid: 'paid', 'πωλείται': 'paid', both: 'both', mixed: 'both', 'και τα δύο': 'both', 'μικτό': 'both', none: 'none', 'χωρίς': 'none' };
const FIELD_MAP = {
  barber: { otunit: 'otUnit', othoursday: 'otHoursDay', othoursperday: 'otHoursDay', otdays: 'otDays', othours: 'otHours', overtime: 'otHours', otcutsperhour: 'otCutsPerHour', otrate: 'otRate', turnpct: 'turnPct', turnoverpct: 'turnPct', turnbase: 'turnBase', mode: 'mode', cutsperday: 'cutsPerDay', cuts: 'cutsPerDay', salary: 'salary', bonuspct: 'bonusPct', bonus: 'bonusPct', rent: 'rent', barberpct: 'barberPct', commissionpct: 'barberPct', commission: 'barberPct', ticket: 'ticket' },
  partner: { cappct: 'capPct', capital: 'capPct', share: 'share', profitpct: 'share', sharepct: 'share', role: 'role' },
  service: { price: 'price', mix: 'mix', mixpct: 'mix' },
  capex: { amount: 'amount', on: 'on', enabled: 'on', qty: 'qty', quantity: 'qty', unit: 'unit', unitprice: 'unit', price: 'unit' },
  fixed: { amount: 'amount' }
};
const normKey = k => String(k || '').toLowerCase().replace(/[^a-z0-9]/g, '');
const pickKey = (obj, k) => Object.keys(obj).find(x => normKey(x) === normKey(k));

function csvNum(v) {
  let t = String(v ?? '').replace(/[€%\s]/g, '');
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d+,\d+$/.test(t)) t = t.replace(',', '.');
  else t = t.replace(/,/g, '');
  const n = parseFloat(t);
  return isFinite(n) ? n : null;
}
const csvBool = v => !/^(0|no|false|όχι|οχι|off)$/i.test(String(v).trim());

function parseCsv(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : (first.includes('\t') && !first.includes(',') ? '\t' : ',');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  const head = (rows.shift() || []).map(h => normKey(h));
  const idx = Object.fromEntries(CSV_COLS.map(c => [c, head.indexOf(c)]));
  if (idx.section < 0 || idx.value < 0) throw new Error('Το CSV πρέπει να έχει στήλες: ' + CSV_COLS.join(', '));
  return rows.filter(r => r.some(x => String(x).trim() !== '')).map(r => Object.fromEntries(CSV_COLS.map(c => [c, idx[c] >= 0 ? String(r[idx[c]] ?? '').trim() : ''])));
}

function csvToState(rows, base) {
  const next = clone(base), warn = [], lists = {}, counts = {};
  const order = {};
  const getItem = (sec, key, make) => {
    lists[sec] = lists[sec] || new Map(); order[sec] = order[sec] || [];
    if (!lists[sec].has(key)) { lists[sec].set(key, make()); order[sec].push(key); }
    return lists[sec].get(key);
  };
  rows.forEach((r, n) => {
    const line = n + 2;
    const sec = normKey(r.section).replace(/s$/, '');
    const f = normKey(r.field);
    if (sec === 'capex' || sec === 'fixed') {
      if (!r.name) { warn.push(`Γραμμή ${line}: λείπει όνομα`); return; }
      const it = sec === 'capex'
        ? getItem(sec, (r.category || 'Λοιπά') + '|' + r.name, () => ({ cat: r.category || 'Λοιπά', name: r.name, amount: 0, qty: 1, unit: null, on: true, note: '' }))
        : getItem(sec, r.name, () => ({ name: r.name, amount: 0, note: '' }));
      const key = FIELD_MAP[sec][f || 'amount'];
      if (key === 'on') it.on = csvBool(r.value);
      else if (key === 'qty' || key === 'unit') { const v = csvNum(r.value); if (v == null) warn.push(`Γραμμή ${line}: μη έγκυρος αριθμός «${r.value}»`); else it[key] = v; }
      else if (key === 'amount') { const v = csvNum(r.value); if (v == null) warn.push(`Γραμμή ${line}: μη έγκυρο ποσό «${r.value}»`); else it.amount = v; }
      else warn.push(`Γραμμή ${line}: άγνωστο πεδίο «${r.field}»`);
      if (r.note) it.note = r.note;
    } else if (sec === 'service' || sec === 'barber' || sec === 'partner') {
      if (!r.name) { warn.push(`Γραμμή ${line}: λείπει όνομα`); return; }
      const make = { service: () => ({ name: r.name, price: 0, mix: 0 }), barber: () => Object.assign(blankBarber(1), { name: r.name }), partner: () => ({ name: r.name, capPct: 0, share: 0, role: '' }) }[sec];
      const it = getItem(sec, r.name, make);
      const key = FIELD_MAP[sec][f];
      if (!key) { warn.push(`Γραμμή ${line}: άγνωστο πεδίο «${r.field}» για ${sec}`); return; }
      if (key === 'otUnit') { const u = /day|ημ/i.test(r.value) ? 'day' : 'month'; it.otUnit = u; return; }
      if (key === 'mode') { const m = MODE_ALIASES[String(r.value).toLowerCase().trim()]; if (m) it.mode = m; else warn.push(`Γραμμή ${line}: άγνωστο μοντέλο «${r.value}»`); }
      else if (key === 'role') it.role = r.value;
      else { const v = csvNum(r.value); if (v == null) warn.push(`Γραμμή ${line}: μη έγκυρος αριθμός «${r.value}»`); else it[key] = v; }
    } else if (sec === 'setting' || sec === 'barista' || sec === 'retail') {
      const target = sec === 'setting' ? next.settings : next[sec];
      const key = pickKey(target, r.field);
      if (!key) { warn.push(`Γραμμή ${line}: άγνωστη ρύθμιση «${r.field}»`); return; }
      if (key === 'enabled') target[key] = csvBool(r.value);
      else if (key === 'coffeeMode') { const m = COFFEE_ALIASES[String(r.value).toLowerCase().trim()]; if (m) target[key] = m; else warn.push(`Γραμμή ${line}: άγνωστος τρόπος καφέ «${r.value}»`); }
      else { const v = csvNum(r.value); if (v == null) warn.push(`Γραμμή ${line}: μη έγκυρος αριθμός «${r.value}»`); else target[key] = v; }
      counts[sec] = (counts[sec] || 0) + 1;
    } else warn.push(`Γραμμή ${line}: άγνωστη ενότητα «${r.section}»`);
  });
  const target = { capex: 'capex', fixed: 'fixed', service: 'services', barber: 'barbers', partner: 'partners' };
  Object.keys(lists).forEach(sec => { next[target[sec]] = order[sec].map(k => lists[sec].get(k)); counts[sec] = order[sec].length; });
  return { next, warn, counts };
}

function stateToCsv(st) {
  const out = [CSV_COLS];
  const add = (...r) => out.push(r);
  st.capex.forEach(x => { add('capex', x.cat, x.name, 'qty', x.qty ?? 1, ''); add('capex', x.cat, x.name, 'unit', x.unit ?? x.amount, x.note || ''); if (!x.on) add('capex', x.cat, x.name, 'on', 0, ''); });
  st.fixed.forEach(x => add('fixed', '', x.name, 'amount', x.amount, x.note || ''));
  st.services.forEach(x => { add('service', '', x.name, 'price', x.price, ''); add('service', '', x.name, 'mix', x.mix, ''); });
  st.barbers.forEach(b => ['mode', 'cutsPerDay', 'salary', 'bonusPct', 'rent', 'barberPct', 'ticket'].forEach(k => add('barber', '', b.name, k, b[k], '')));
  st.partners.forEach(p => ['capPct', 'share', 'role'].forEach(k => add('partner', '', p.name, k, p[k], '')));
  Object.entries(st.barista).forEach(([k, v]) => add('barista', '', '', k, typeof v === 'boolean' ? (v ? 1 : 0) : v, ''));
  Object.entries(st.retail).forEach(([k, v]) => add('retail', '', '', k, v, ''));
  Object.entries(st.settings).forEach(([k, v]) => add('setting', '', '', k, v, ''));
  return out.map(r => r.map(c => { const t = String(c ?? ''); return /[",\n;]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; }).join(',')).join('\n');
}

async function importCsvFile(f) {
  try {
    const rows = parseCsv(await f.text());
    if (!rows.length) { toast('Το CSV είναι άδειο'); return; }
    const { next, warn, counts } = csvToState(rows, S);
    const labels = Object.assign({}, LIST_SECTIONS, { setting: 'Παραδοχές', barista: 'Μπαρίστα/καφές', retail: 'Λιανική' });
    const lines = Object.entries(counts).map(([k, n]) => `• ${labels[k]}: ${n}${LIST_SECTIONS[k] ? ' (αντικαθιστά τη λίστα)' : ' τιμές'}`);
    const msg = `Εισαγωγή CSV — ${rows.length} γραμμές\n\n${lines.join('\n')}` +
      (warn.length ? `\n\n${warn.length} προειδοποιήσεις:\n${warn.slice(0, 8).join('\n')}${warn.length > 8 ? '\n…' : ''}` : '') +
      `\n\nΗ τωρινή έκδοση θα κρατηθεί ως σενάριο. Να γίνει η εισαγωγή για όλους;`;
    if (!confirm(msg)) return;
    const sc = scenarios(); sc[`Πριν την εισαγωγή CSV ${new Date().toLocaleString('el-GR')}`] = clone(S); ls.set(LS_SCN, JSON.stringify(sc));
    sync.note = (VIEW === 'target' ? 'Στόχος · ' : '') + `Εισαγωγή CSV «${f.name}» (${rows.length} γραμμές: ${Object.entries(counts).map(([k, n]) => `${labels[k]} ${n}`).join(', ')})`;
    S = hydrate(next); save(); renderView(); toast('Η εισαγωγή ολοκληρώθηκε');
  } catch (err) { console.error(err); alert('Δεν διαβάστηκε το CSV: ' + err.message); }
}

/* =========================================================
   SHARED SYNC (Supabase)
   State is encrypted in the browser with DATA_KEY (baked into the
   encrypted app). Each user has a personal write token; the server
   checks sha256(token), so it knows who saved what (history).
   ========================================================= */
const SYNC_URL = 'https://miaaynxgowqyyivtdnhs.supabase.co';
const SYNC_KEY = 'sb_publishable_6xYzhezNfoXDbCQ1GKzupA_bQcuel3X';
const DATA_KEY = '__BARBER_DATA_KEY__';
const AUTH = window.__barber || null;
const sync = { on: false, key: null, version: null, timer: null, pending: false, saving: false, state: 'local', by: '', at: null, base: null, note: '' };
const who = () => (AUTH && AUTH.user) || '';
const b64e = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const fmtTime = t => t ? new Date(t).toLocaleString('el-GR', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';

function setSync(st) {
  sync.state = st;
  const map = {
    local: ['var(--muted)', 'μόνο σε αυτή τη συσκευή'],
    ok: ['var(--pos)', `${who() ? who() + ' · ' : ''}τελευταία αλλαγή ${fmtTime(sync.at)}${sync.by ? ' (' + sync.by + ')' : ''}`],
    pending: ['var(--accent)', 'αποθήκευση…'],
    err: ['var(--neg)', 'χωρίς σύνδεση — οι αλλαγές μένουν τοπικά'],
    denied: ['var(--neg)', 'ο κωδικός σου δεν επιτρέπει αποθήκευση']
  };
  let [c, txt] = map[st] || map.local;
  if (typeof VIEW !== 'undefined' && VIEW === 'play') { c = 'var(--c1)'; txt = 'παίζεις · δεν αποθηκεύεται'; }
  const el = $('subtitle');
  if (el) el.innerHTML = `<span style="color:${c}">●</span> ${esc(txt)}`;
}
async function rpc(fn, body) {
  const r = await fetch(`${SYNC_URL}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: SYNC_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const txt = await r.text();
  if (!r.ok) { const e = new Error(txt); e.status = r.status; throw e; }
  return txt ? JSON.parse(txt) : null;
}
async function encryptObj(o) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, sync.key, new TextEncoder().encode(JSON.stringify(o)));
  return JSON.stringify({ i: b64e(iv), c: b64e(ct) });
}
async function decryptObj(s) {
  const p = JSON.parse(s);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(p.i) }, sync.key, b64d(p.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
const snapshot = () => ({ state: clone(baseState()), target: targetState() ? clone(targetState()) : null, scenarios: scenarios() });

async function syncInit() {
  if (!AUTH || !AUTH.token || !/^[0-9a-f]{64}$/.test(DATA_KEY) || !window.crypto || !crypto.subtle) { setSync('local'); return; }
  setSync('pending');
  try {
    const raw = Uint8Array.from(DATA_KEY.match(/../g).map(h => parseInt(h, 16)));
    sync.key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
    sync.on = true;
    rpc('barber_login', { p_token: AUTH.token }).catch(e => { if (e.status === 403 || /forbidden/.test(e.message)) setSync('denied'); });
    await pull({ initial: true });
    setInterval(() => { if (!document.hidden) pull({}); }, 20000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) pull({}); });
  } catch (e) { console.error(e); setSync('err'); }
}
async function pull({ initial = false, force = false }) {
  if (!sync.on || (!force && (sync.pending || sync.saving))) return;
  try {
    const r = await rpc('barber_load');
    if (!r) { if (initial) { sync.base = { state: clone(DEFAULTS), scenarios: {} }; sync.note = 'Πρώτη αποθήκευση'; await push(); } else setSync('ok'); return; }
    if (r.version === sync.version) { if (sync.state !== 'denied') setSync('ok'); return; }
    let o;
    try { o = await decryptObj(r.data); }
    catch (e) { console.error('cannot decrypt shared state', e); setSync('err'); return; }
    const editing = document.activeElement && document.activeElement.matches('#view input, #view select');
    if (!initial && !force && editing) return; // retry on next poll, don't steal focus
    sync.version = r.version; sync.by = r.updated_by || ''; sync.at = r.updated_at;
    sync.base = applyShared(o);
    renderView();
    setSync('ok');
    if (!initial && sync.by && sync.by !== who()) toast(`Νέα έκδοση από ${sync.by}`);
  } catch (e) { console.error(e); setSync('err'); }
}
function schedulePush() {
  if (!sync.on) return;
  sync.pending = true; setSync('pending');
  clearTimeout(sync.timer);
  sync.timer = setTimeout(push, 1500);
}
async function push() {
  sync.pending = false;
  const snap = snapshot();
  const changes = (sync.note ? [sync.note] : []).concat(sync.base ? diffStates(sync.base, snap) : []);
  if (!changes.length && sync.version != null) { setSync('ok'); return; }
  sync.saving = true;
  try {
    const data = await encryptObj(snap);
    const log = await encryptObj({ changes });
    const r = await rpc('barber_save', { p_token: AUTH.token, p_data: data, p_version: sync.version, p_log: log });
    if (r && r.ok) {
      sync.version = r.version; sync.by = r.user || who(); sync.at = new Date().toISOString(); sync.base = snap; sync.note = '';
      setSync('ok');
      if (TAB === 'history') loadHistory();
    } else if (r && r.conflict) {
      sync.saving = false;
      toast('Κάποιος άλλος άλλαξε κάτι ταυτόχρονα — φορτώθηκε η δική του έκδοση');
      await pull({ force: true });
    }
  } catch (e) {
    console.error(e);
    setSync(e.status === 403 || /forbidden|42501/.test(e.message) ? 'denied' : 'err');
  } finally {
    sync.saving = false;
    if (sync.pending) { clearTimeout(sync.timer); sync.timer = setTimeout(push, 1500); }
  }
}

function fmtV(k, v) {
  if (typeof v === 'boolean') return v ? 'ναι' : 'όχι';
  if (k === 'mode') return (MODES[v] || {}).label || v;
  if (k === 'otUnit') return { month: 'ανά μήνα', day: 'ανά ημέρα' }[v] || v;
  if (k === 'turnBase') return { shop: 'όλο το μαγαζί', own: 'δικά του κουρέματα' }[v] || v;
  if (k === 'coffeeMode') return { free: 'κερασμένος', paid: 'πωλείται', both: 'πωλείται + κερασμένος', none: 'χωρίς' }[v] || v;
  if (typeof v === 'number') return num1(v);
  return `«${v ?? ''}»`;
}
function diffStates(a, b) {
  const out = diffOne(a.state, b.state);
  if (b.target) {
    if (!a.target) out.push('Δημιουργήθηκε ο «Στόχος»', ...diffOne(b.state, b.target).map(x => 'Στόχος · ' + x));
    else out.push(...diffOne(a.target, b.target).filter(x => !/κλείδωσε/i.test(x)).map(x => 'Στόχος · ' + x));
  } else if (a.target) out.push('Διαγράφηκε ο «Στόχος»');
  const sa = Object.keys(a.scenarios || {}), sb = Object.keys(b.scenarios || {});
  sb.filter(n => !sa.includes(n)).forEach(n => out.push(`+ Σενάριο «${n}»`));
  sa.filter(n => !sb.includes(n)).forEach(n => out.push(`− Σενάριο «${n}»`));
  return out;
}
function diffOne(A, B) {
  const out = [];
  ['barbers', 'services', 'capex', 'fixed', 'partners'].forEach(sec => {
    const xa = A[sec] || [], xb = B[sec] || [], L = SEC_LABEL[sec];
    const fieldDiff = (p, q) => Object.keys(Object.assign({}, p, q)).forEach(k => {
      if (k !== 'name' && JSON.stringify(p[k]) !== JSON.stringify(q[k])) out.push(`${L} «${q.name}»: ${F_LABEL[k] || k} ${fmtV(k, p[k])} → ${fmtV(k, q[k])}`);
    });
    if (xa.length === xb.length) {
      xa.forEach((p, i) => { const q = xb[i]; if (p.name !== q.name) out.push(`${L}: μετονομασία «${p.name}» → «${q.name}»`); fieldDiff(p, q); });
    } else {
      const ka = new Map(xa.map(x => [x.name, x])), kb = new Map(xb.map(x => [x.name, x]));
      xb.forEach(q => { if (!ka.has(q.name)) out.push(`+ ${L}: «${q.name}»`); else fieldDiff(ka.get(q.name), q); });
      xa.forEach(p => { if (!kb.has(p.name)) out.push(`− ${L}: «${p.name}»`); });
    }
  });
  ['settings', 'barista', 'retail', 'finance'].forEach(sec => {
    const p = A[sec] || {}, q = B[sec] || {};
    Object.keys(q).forEach(k => { if (JSON.stringify(p[k]) !== JSON.stringify(q[k])) out.push(`${SEC_LABEL[sec]}: ${F_LABEL[k] || k} ${fmtV(k, p[k])} → ${fmtV(k, q[k])}`); });
  });
  if (!!A.locked !== !!B.locked) out.push(B.locked ? 'Κλείδωσε τα νούμερα' : 'Ξεκλείδωσε τα νούμερα');
  return out;
}

function rHistory() {
  return `
  <h2>Ιστορικό</h2>
  <p class="lead">Ποιος άλλαξε τι και πότε, και ποιος συνδέθηκε. Κάθε αλλαγή κρατά ολόκληρη την έκδοση· μπορείς να γυρίσεις σε όποια θέλεις.</p>
  <div class="btns" style="margin-bottom:12px"><label class="chk"><input type="checkbox" id="histLogins"${ls.get('barber.histLogins') === '0' ? '' : ' checked'}> Δείξε και τις συνδέσεις</label><button class="btn sec2" data-act="histReload">Ανανέωση</button></div>
  <div id="hist">${sync.on ? '<p class="small">Φόρτωση…</p>' : '<p class="small">Το ιστορικό είναι διαθέσιμο μόνο στη δημοσιευμένη σελίδα με κωδικό.</p>'}</div>`;
}
let histSeq = 0;
const hhmm = x => x ? new Date(x).toLocaleTimeString('el-GR', { hour: '2-digit', minute: '2-digit' }) : '';
async function loadHistory() {
  if (!sync.on || !$('hist')) return;
  const my = ++histSeq;
  try {
    const rows = await rpc('barber_log_list', { p_token: AUTH.token, p_limit: 200 });
    const logins = ls.get('barber.histLogins') !== '0';
    const items = [];
    for (const r of rows) {
      if (r.kind === 'login' && !logins) continue;
      let ch = [];
      if (r.kind === 'change' && r.summary) { try { ch = (await decryptObj(r.summary)).changes || []; } catch (e) { ch = ['(δεν διαβάζεται)']; } }
      items.push({ r, ch });
    }
    if (my !== histSeq || !$('hist')) return;
    // ενώνει συνεχόμενες αλλαγές του ίδιου ατόμου μέσα σε 5 λεπτά (π.χ. ενδιάμεσα πληκτρολόγησης)
    const merged = [];
    for (const it of items) {
      const last = merged[merged.length - 1];
      if (last && it.r.kind === 'change' && last.r.kind === 'change' && last.r.user_name === it.r.user_name &&
          new Date(last.first).getTime() - new Date(it.r.at).getTime() <= 5 * 60000) {
        last.parts.unshift(it.ch); last.first = it.r.at;
      } else merged.push({ r: it.r, ch: it.ch, parts: [it.ch], first: it.r.at });
    }
    merged.forEach(g => {
      if (g.parts.length < 2) return;
      const order = [], map = new Map();
      g.parts.flat().forEach(line => {
        const m = line.match(/^(.*) (\S+) → (.*)$/);
        if (!m) { order.push({ raw: line }); return; }
        const cur = map.get(m[1]);
        if (cur) cur.to = m[3]; else { const o = { key: m[1], from: m[2], to: m[3] }; map.set(m[1], o); order.push(o); }
      });
      g.ch = order.filter(o => o.raw || o.from !== o.to).map(o => o.raw || `${o.key} ${o.from} → ${o.to}`);
      if (!g.ch.length) g.ch = ['(καμία καθαρή αλλαγή)'];
    });
    items.length = 0; items.push(...merged);
    const byDay = {};
    items.forEach(it => { const d = new Date(it.r.at).toLocaleDateString('el-GR', { weekday: 'long', day: 'numeric', month: 'long' }); (byDay[d] = byDay[d] || []).push(it); });
    $('hist').innerHTML = items.length ? Object.entries(byDay).map(([d, list]) => `<div class="card" style="margin-bottom:12px"><h3 style="text-transform:capitalize">${esc(d)}</h3>${list.map(({ r, ch, first }) => `
      <div class="hrow ${r.kind}">
        <div class="hmeta"><b>${esc(r.user_name)}</b><span class="small">${hhmm(first) !== hhmm(r.at) ? `${hhmm(first)}–${hhmm(r.at)}` : hhmm(r.at)}</span></div>
        ${r.kind === 'login' ? '<div class="small">συνδέθηκε</div>' : `<ul class="hch">${ch.slice(0, 12).map(c => `<li>${esc(c)}</li>`).join('')}${ch.length > 12 ? `<li class="small">και ${ch.length - 12} ακόμα</li>` : ''}</ul>
        ${r.has_snapshot ? `<button class="btn sec2 hbtn" data-act="restore" data-id="${r.id}" data-at="${esc(r.at)}">Επαναφορά σε αυτή την έκδοση</button>` : ''}`}
      </div>`).join('')}</div>`).join('') : '<p class="small">Κανένα συμβάν ακόμα.</p>';
  } catch (e) { console.error(e); if ($('hist')) $('hist').innerHTML = '<p class="small neg">Δεν φορτώθηκε το ιστορικό.</p>'; }
}
async function restoreVersion(id, at) {
  if (S.locked) { toast('Κλειδωμένο — πάτα «Ξεκλείδωμα»'); return; }
  if (!confirm(`Επαναφορά όλων των νούμερων στην έκδοση της ${fmtTime(at)}; Θα ισχύσει για όλους.`)) return;
  if (VIEW === 'play') setView('base');

    save(); renderView(); toast('Έγινε επαναφορά');
  } catch (e) { console.error(e); toast('Η επαναφορά απέτυχε'); }
}

const BUILD = '__BARBER_BUILD__';
