<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barber · Καλαμάτα</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1ea; --surface:#fffdf9; --surface2:#efe9df; --ink:#1c1915; --muted:#6e665a; --line:#e0d8ca;
  --accent:#9c6a22; --accent-soft:#f1e3cb; --pos:#2c7a4b; --pos-soft:#dcefe2; --neg:#b0402d; --neg-soft:#f7dfd9;
  --c1:#9c6a22; --c2:#3f6e8c; --c3:#7a5a8f; --c4:#4f8a6b; --c5:#b0402d; --c6:#8a8172;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13110e; --surface:#1c1915; --surface2:#26221c; --ink:#f0e9de; --muted:#a59b8b; --line:#332e26;
    --accent:#d8a650; --accent-soft:#3a2e1b; --pos:#62c08a; --pos-soft:#1c3326; --neg:#e57a66; --neg-soft:#3d221d;
    --c1:#d8a650; --c2:#6fa3c4; --c3:#a88bc0; --c4:#72b892; --c5:#e57a66; --c6:#8f8778;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13110e; --surface:#1c1915; --surface2:#26221c; --ink:#f0e9de; --muted:#a59b8b; --line:#332e26;
  --accent:#d8a650; --accent-soft:#3a2e1b; --pos:#62c08a; --pos-soft:#1c3326; --neg:#e57a66; --neg-soft:#3d221d;
  --c1:#d8a650; --c2:#6fa3c4; --c3:#a88bc0; --c4:#72b892; --c5:#e57a66; --c6:#8f8778;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Commissioner,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}

/* header */
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 6px}
.logo{display:flex;align-items:center;gap:10px}
.pole{width:10px;height:28px;border-radius:5px;background:repeating-linear-gradient(-45deg,var(--neg) 0 5px,var(--surface) 5px 10px,var(--c2) 10px 15px,var(--surface) 15px 20px);border:1px solid var(--line)}
.logo h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
.logo small{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em;margin-top:-2px}
.hbtns{display:flex;gap:6px}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.strip{display:flex;gap:22px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.st{white-space:nowrap}
.st>span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.st b{font-size:17px;font-weight:700}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;white-space:nowrap;color:var(--muted);font-weight:500;font-size:14px}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}

main{padding:18px 0 60px}
h2{font-size:22px;margin:4px 0 4px;font-weight:700;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 10px;font-weight:700}
.lead{color:var(--muted);margin:0 0 16px;max-width:760px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.kgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.flat{background:var(--surface2)}
.sec{margin-top:14px}
.kpi>span{display:block;font-size:12px;color:var(--muted)}
.kpi b{display:block;font-size:22px;font-weight:700;margin-top:2px;letter-spacing:-.01em}
.kpi em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row.tot{font-weight:700;border-top:1px solid var(--ink);border-bottom:0;margin-top:4px;padding-top:8px}
.row.sub{font-weight:600}
.row .l{color:var(--muted)}
.row.tot .l,.row.sub .l{color:var(--ink)}
.small{font-size:12.5px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 12px;margin-top:10px}
.warn{background:var(--neg-soft);color:var(--ink)}

/* fields */
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label.f>span{font-size:12px;color:var(--muted)}
label.f>em{font-style:normal;font-size:11.5px;color:var(--muted)}
.inp{display:flex;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.inp:focus-within{border-color:var(--accent)}
.inp input,.inp select{flex:1;min-width:0;border:0;background:none;color:inherit;font:inherit;padding:7px 9px;outline:none;-moz-appearance:textfield}
.inp input::-webkit-inner-spin-button{opacity:.4}
.inp i{font-style:normal;color:var(--muted);font-size:13px;padding-right:9px;white-space:nowrap}
input.txt{width:100%;border:1px solid transparent;background:none;color:inherit;font:inherit;padding:4px 6px;border-radius:6px;margin-left:-6px}
input.txt:hover{border-color:var(--line)} input.txt:focus{border-color:var(--accent);outline:none;background:var(--surface2)}
input.name{font-size:17px;font-weight:700}
select.sel{width:100%;border:1px solid var(--line);background:var(--surface2);color:inherit;font:inherit;padding:7px 9px;border-radius:8px}
input[type=range]{width:100%;accent-color:var(--accent)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px}
.btn.sec2{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.x{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:4px 6px;border-radius:6px}
.x:hover{color:var(--neg);background:var(--neg-soft)}
.btns{display:flex;flex-wrap:wrap;gap:8px}

/* barbers */
.bc{position:relative}
.bc .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.bc .hd input{flex:1}
.mode{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.slider{margin:6px 0 10px}
.slider .top{display:flex;justify-content:space-between;align-items:baseline}
.slider .top b{font-size:20px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.res div{background:var(--surface2);border-radius:9px;padding:8px 10px}
.res span{display:block;font-size:11.5px;color:var(--muted)}
.res b{font-size:16px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em}
.tbl td{padding:4px 6px;border-bottom:1px dashed var(--line);vertical-align:middle}
.tbl td.num,.tbl th.num{text-align:right}
.tbl .inp{min-width:90px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cap-item{display:grid;grid-template-columns:24px 1fr 120px 28px;gap:6px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
.cap-item .nt{grid-column:2/4;font-size:12px;color:var(--muted);margin-top:-4px}
.cap-item.off{opacity:.5}
.cathd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.cathd b{font-size:15px}

/* bars */
.bars .b{margin:7px 0}
.bars .bl{display:flex;justify-content:space-between;font-size:13px}
.bars .bt{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:3px}
.bars .bf{height:100%;border-radius:99px}
.stack{display:flex;height:22px;border-radius:7px;overflow:hidden;margin:6px 0 10px;background:var(--surface2)}
.stack div{height:100%}
.legend{display:flex;flex-direction:column;gap:3px}
.legend .row span:first-child{display:flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}

/* heat */
.heat{border-collapse:separate;border-spacing:3px;width:100%;font-size:13px}
.heat th{font-size:11.5px;color:var(--muted);font-weight:600;padding:4px}
.heat td{text-align:center;padding:8px 4px;border-radius:7px;font-weight:600;white-space:nowrap}
.heat td.cur{outline:2px solid var(--ink);outline-offset:-2px}

.models{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.model{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface2)}
.model.best{border-color:var(--pos);box-shadow:inset 0 0 0 1px var(--pos)}
.model b{font-size:20px;display:block}
svg text{fill:var(--muted);font-size:12px;font-family:inherit}
.scn{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
@media (max-width:600px){
  #lockBtn .lbl{display:none}
  #lockBtn svg{margin-right:0}
  h2{font-size:19px}
  .kpi b{font-size:19px}
  .card{padding:13px}
  .capx{grid-template-columns:22px 1fr 26px}
  .capx .inp{grid-column:2;grid-row:2;max-width:170px}
  .capx .x{grid-column:3;grid-row:1}
  .capx .nt{grid-column:2;margin-top:0}
}
.ghost.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ghost svg{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
.lockbar svg{width:15px;height:15px;vertical-align:-2px;margin-right:6px;flex:none}
.tbl input.txt{min-width:130px}
body.locked [data-act^="add"],body.locked [data-act^="del"],body.locked [data-act="reset"],body.locked [data-act="import"],body.locked [data-act="importCsvBtn"],body.locked [data-act="loadScn"]{display:none!important}
body.locked #view input:disabled,body.locked #view select:disabled{opacity:.75;cursor:not-allowed}
body.locked input.txt:hover{border-color:transparent}
.lockbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:14px}
@media print{header.top nav,.hbtns,.x,.btn{display:none!important} header.top{position:static}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="logo"><div class="pole"></div><div><h1>Barber</h1><small id="subtitle">Καλαμάτα · επιχειρηματικό πλάνο</small></div></div>
      <div class="hbtns">
        <button class="ghost" data-act="lock" id="lockBtn" title="Κλείδωμα αλλαγών"></button>
        <button class="ghost" data-act="theme" title="Θέμα">◐</button>
        <button class="ghost" data-act="logout">Έξοδος</button>
      </div>
    </div>
    <div class="strip" id="strip"></div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="view"></main>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" hidden>
<input type="file" id="importCsv" accept=".csv,text/csv,text/plain" hidden>

const fE2 = new Intl.NumberFormat('el-GR', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 });

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* =========================================================
   MODEL
   ========================================================= */
function avgTicket(s) {
  const tot = s.services.reduce((a, x) => a + (+x.mix || 0), 0);
  if (!tot) return 0;
  return s.services.reduce((a, x) => a + (+x.price || 0) * (+x.mix || 0), 0) / tot;
}

/* opt: k = πολλαπλασιαστής πελατείας (ramp-up), cpd = override κουρέματα/ημέρα, ticket = override μέση απόδειξη, mode = override μοντέλο */
function compute(s, opt = {}) {
  const st = s.settings, k = opt.k ?? 1;
  const vS = 1 + st.vatServices / 100, vC = 1 + st.vatCoffee / 100, vP = 1 + st.vatProducts / 100;
  const er = 1 + st.employerRate / 100, sm = st.salaryMonths / 12;
  const card = (gross) => gross * st.cardShare / 100 * st.cardFee / 100;
  const at = avgTicket(s);
  const rev = { services: 0, chairRent: 0, coffee: 0, retail: 0 };
  const cost = { staff: 0, consum: 0, card: 0, barista: 0, coffee: 0, retail: 0, fixed: 0 };
  let clients = 0, shopCuts = 0, shopGross = 0, shopNet = 0, payrollBase = 0;

  const barbers = s.barbers.map(b => {
    const mode = (opt.mode && b.mode !== 'partner') ? opt.mode : b.mode;
    const cpd = opt.cpd ?? (+b.cutsPerDay || 0);
    const cuts = cpd * k * st.daysPerMonth;
    const ticket = opt.ticket ?? ((+b.ticket > 0) ? +b.ticket : at);
    const gross = cuts * ticket, net = gross / vS;
    const r = { name: b.name, mode, cuts, ticket, gross, net, shopRev: 0, staff: 0, consum: 0, card: 0, barberEarn: 0, barberNote: '' };
    clients += cuts;
    if (mode === 'rent') {
      r.shopRev = +b.rent || 0;
      rev.chairRent += r.shopRev;
      r.barberEarn = net - r.shopRev - cuts * st.consumablePerCut;
      r.barberNote = 'πριν από δικό του ΕΦΚΑ & φόρο';
    } else {
      r.shopRev = net; rev.services += net;
      r.consum = cuts * st.consumablePerCut;
      r.card = card(gross);
      shopCuts += cuts; shopGross += gross; shopNet += net;
      if (mode === 'salary') {
        const base = (+b.salary || 0) * sm;
        const bonus = net * (+b.bonusPct || 0) / 100;
        r.staff = (base + bonus) * er;
        payrollBase += base * er;
        r.barberEarn = base + bonus;
        r.barberNote = 'μικτά/μήνα (με δώρα & επίδομα)';
      } else if (mode === 'commission') {
        r.staff = net * (+b.barberPct || 0) / 100;
        r.barberEarn = r.staff;
        r.barberNote = 'πριν από δικό του ΕΦΚΑ & φόρο';
      } else {
        r.barberNote = 'αμείβεται από τα κέρδη';
      }
    }
    r.contrib = r.shopRev - r.staff - r.consum - r.card;
    cost.staff += r.staff; cost.consum += r.consum; cost.card += r.card;
    return r;
  });

  // μπαρίστα & καφές
  const ba = s.barista;
  let cups = 0;
  if (ba.enabled) { cost.barista = (+ba.salary || 0) * sm * er * (+ba.fte || 0) / 100; payrollBase += cost.barista; }
  if (ba.coffeeMode === 'free') {
    cups = clients * (+ba.takeRate || 0) / 100;
    cost.coffee = cups * (+ba.costPerCup || 0);
  } else if (ba.coffeeMode === 'paid') {
    cups = (+ba.cupsPerDay || 0) * k * st.daysPerMonth;
    const g = cups * (+ba.price || 0);
    rev.coffee = g / vC;
    cost.coffee = cups * (+ba.costPerCup || 0);
    cost.card += card(g);
  }

  // λιανική
  const rg = (+s.retail.sales || 0) * k;
  rev.retail = rg / vP;
  cost.retail = rev.retail * (1 - (+s.retail.margin || 0) / 100);
  cost.card += card(rg);

  cost.fixed = s.fixed.reduce((a, x) => a + (+x.amount || 0), 0);

  const revenue = rev.services + rev.chairRent + rev.coffee + rev.retail;
  const costs = Object.values(cost).reduce((a, b) => a + b, 0);
  const preTax = revenue - costs;
  const tax = Math.max(0, preTax) * st.corpTax / 100;
  const net = preTax - tax;
  const dist = net > 0 ? net * (1 - st.dividendTax / 100) : net;
  const grossReceipts = shopGross + (ba.coffeeMode === 'paid' ? cups * (+ba.price || 0) : 0) + rg;
  return { barbers, rev, cost, revenue, costs, preTax, tax, net, dist, clients, shopCuts, shopGross, shopNet, cups, payrollBase, grossReceipts, avgTicket: at };
}

function capexTotals(s, R) {
  const cats = {};
  let items = 0;
  s.capex.forEach(x => { cats[x.cat] = cats[x.cat] || 0; if (x.on) { cats[x.cat] += +x.amount || 0; items += +x.amount || 0; } });
  const contingency = items * s.settings.contingencyPct / 100;
  const reserve = s.settings.reserveMonths * (R.cost.fixed + R.payrollBase);
  return { cats, items, contingency, reserve, spend: items + contingency, total: items + contingency + reserve };
}

function rampK(s, m) {
  const st = s.settings, r = Math.max(0, st.rampMonths | 0), a = st.rampStart / 100;
  if (r <= 0) return 1;
  return Math.min(1, a + (1 - a) * (m - 1) / r);
}

function cashflow(s, C) {
  const H = s.settings.horizon, cum = [], monthly = [];
  let c = -C.spend, payback = null, min = c;
  for (let m = 1; m <= H; m++) {
    const R = compute(s, { k: rampK(s, m) });
    monthly.push(R.net); c += R.net; cum.push(c);
    if (c < min) min = c;
    if (payback === null && c >= 0) payback = m;
  }
  return { start: -C.spend, cum, monthly, payback, min };
}

function breakeven(s) {
  const p0 = compute(s, { k: 0 }).preTax, p1 = compute(s, { k: 1 }).preTax;
  const work = s.barbers.filter(b => b.mode !== 'rent');
  const avg = work.length ? work.reduce((a, b) => a + (+b.cutsPerDay || 0), 0) / work.length : 0;
  if (p1 <= p0 || !work.length) return { k: null, cpd: null, avg };
  const kk = -p0 / (p1 - p0);
  return { k: kk, cpd: kk * avg, avg, clientsMonth: kk * avg * work.length * s.settings.daysPerMonth };
}

  const st = S.settings;
  setHTML('ov-kpis', [
    ['Τζίρος/μήνα (με ΦΠΑ)', eur(R.grossReceipts + R.rev.chairRent * (1 + st.vatServices / 100)), `${num(R.clients)} πελάτες`],
    ['Κέρδος προ φόρων', `<span class="${sgn(R.preTax)}">${eur(R.preTax)}</span>`, `${eur(R.preTax * 12)} / έτος`],
    ['Καθαρό μετά φόρων', `<span class="${sgn(R.net)}">${eur(R.net)}</span>`, `${eur(R.net * 12)} / έτος`],
    ['Απαιτούμενο κεφάλαιο', eur(C.total), `έξοδα ${eur(C.spend)} + αποθεματικό ${eur(C.reserve)}`],
    ['Απόσβεση', CF.payback ? `${CF.payback} μήνες` : `> ${st.horizon} μήνες`, CF.payback ? `με σταδιακή εκκίνηση ${st.rampMonths} μηνών` : 'δεν αποσβένεται'],
    ['Νεκρό σημείο', BE.cpd != null ? `${num1(BE.cpd)} κουρ./ημέρα` : '—', BE.cpd != null ? `ανά κουρέα (σήμερα ${num1(BE.avg)})` : 'δεν υπάρχουν μισθωτοί/ποσοστό']
  ].map(([l, v, e]) => `<div class="card kpi"><span>${l}</span><b>${v}</b><em>${e}</em></div>`).join(''));

  setHTML('ov-ticket', `Μέση απόδειξη <b>${eur2(R.avgTicket)}</b> με ΦΠΑ (${eur2(R.avgTicket / (1 + st.vatServices / 100))} καθαρά), με βάση το μείγμα υπηρεσιών. Αλλάζεις μείγμα στην καρτέλα «Κουρείς & τιμές».`);

  const r = R.rev, c = R.cost;
  setHTML('ov-pl',
    row('Κουρέματα (μισθωτοί, ποσοστό, εταίροι)', eur(r.services)) +
    (r.chairRent ? row('Ενοίκια θέσεων', eur(r.chairRent)) : '') +
    (r.coffee ? row('Πωλήσεις καφέ', eur(r.coffee)) : '') +
    (r.retail ? row('Πωλήσεις προϊόντων', eur(r.retail)) : '') +
    row('Σύνολο εσόδων', eur(R.revenue), 'sub') +
    row('Μισθοί & αμοιβές κουρέων', '−' + eur(c.staff)) +
    (c.barista ? row('Μπαρίστα (με εισφορές)', '−' + eur(c.barista)) : '') +
    row('Πάγια (ενοίκιο, ρεύμα, λογιστής…)', '−' + eur(c.fixed)) +
    row('Αναλώσιμα κουρείου', '−' + eur(c.consum)) +
    (c.coffee ? row('Πρώτη ύλη καφέ', '−' + eur(c.coffee)) : '') +
    (c.retail ? row('Κόστος προϊόντων', '−' + eur(c.retail)) : '') +
    row('Προμήθειες καρτών', '−' + eur(c.card)) +
    row('Κέρδος προ φόρων', `<span class="${sgn(R.preTax)}">${eur(R.preTax)}</span>`, 'sub') +
    row(`Φόρος εταιρείας ${st.corpTax}%`, '−' + eur(R.tax)) +
    row('Καθαρό κέρδος', `<span class="${sgn(R.net)}">${eur(R.net)}</span>`, 'tot') +
    row(`Προς διανομή (μετά φόρο μερισμάτων ${st.dividendTax}%)`, eur(R.dist)));

  setHTML('ov-cf-sub', `Ξεκινά από −${eur(C.spend)} (έξοδα έναρξης + απρόβλεπτα). Πρώτος μήνας στο ${st.rampStart}% της πελατείας, πλήρης μετά από ${st.rampMonths} μήνες. ` +
    `Χαμηλότερο σημείο ταμείου: <b>${eur(CF.min)}</b>. ` + (CF.payback ? `Τα λεφτά επιστρέφουν τον <b>${CF.payback}ο μήνα</b>.` : `<b class="neg">Δεν επιστρέφουν μέσα σε ${st.horizon} μήνες.</b>`) +
    (-CF.min > C.spend + C.reserve ? ` <b class="neg">Το ταμείο πέφτει στα ${eur(CF.min)} — το αποθεματικό των ${eur(C.reserve)} δεν φτάνει.</b>` : ''));
  setHTML('ov-cf', cashSvg(CF, Math.max(320, ($('ov-cf') || {}).clientWidth || 800)));

  // per-cut
  if (R.shopCuts > 0) {
    const n = R.shopCuts, g = R.shopGross / n;
    const vat = (R.shopGross - R.shopNet) / n;
    const staff = c.staff / n, cons = c.consum / n;
    const cardc = R.barbers.reduce((a, b) => a + b.card, 0) / n;
    const tax = R.tax / n, prof = R.net / n;
    const over = g - vat - staff - cons - cardc - tax - prof;
    const parts = [
      ['ΦΠΑ', vat, 'var(--c6)'], ['Κουρέας (μισθός/ποσοστό)', staff, 'var(--c2)'], ['Αναλώσιμα & POS', cons + cardc, 'var(--c3)'],

  // models
  const ms = ['salary', 'commission', 'rent'].map(m => ({ m, R: compute(S, { mode: m }) }));
  const best = ms.reduce((a, b) => b.R.net > a.R.net ? b : a);
  setHTML('ov-models', ms.map(({ m, R: x }) => {
    const C2 = capexTotals(S, x);
    return `<div class="model ${m === best.m ? 'best' : ''}"><span class="small">${{ salary: 'Όλοι μισθωτοί', commission: 'Όλοι με ποσοστό', rent: 'Όλοι με ενοικίαση θέσης' }[m]}</span><b class="${sgn(x.net)}">${eur(x.net)}</b><span class="small">καθαρό/μήνα · αποθεματικό ${eur(C2.reserve)}</span></div>`;
  }).join(''));
  const avgB = S.barbers.filter(b => b.mode !== 'partner');
  const rentAvg = avgB.length ? avgB.reduce((a, b) => a + (+b.rent || 0), 0) / avgB.length : 0;
  const pctAvg = avgB.length ? avgB.reduce((a, b) => a + (+b.barberPct || 0), 0) / avgB.length : 0;
  setHTML('ov-models-note', `Ενοίκιο θέσης ~${eur(rentAvg)}/μήνα, ποσοστό κουρέα ~${num(pctAvg)}%. Μισθωτοί = μεγαλύτερο κέρδος όταν κουρεύουν πολύ, αλλά σταθερό κόστος και ρίσκο όταν το μαγαζί είναι άδειο. Ενοικίαση = μικρό αλλά σίγουρο έσοδο.`);

  // heat
  const rows = [6, 8, 10, 12, 14, 16], cols = [12, 14, 16, 18, 20, 22];
  const vals = rows.map(r => cols.map(t => compute(S, { cpd: r, ticket: t }).net));
  const mx = Math.max(1, ...vals.flat().map(Math.abs));
  const curR = rows.reduce((a, b) => Math.abs(b - BE.avg) < Math.abs(a - BE.avg) ? b : a);
  const curC = cols.reduce((a, b) => Math.abs(b - R.avgTicket) < Math.abs(a - R.avgTicket) ? b : a);
  setHTML('ov-heat', `<table class="heat"><tr><th>κουρ./ημέρα</th>${cols.map(c => `<th>${c} €</th>`).join('')}</tr>${rows.map((r, i) => `<tr><th>${r}</th>${cols.map((c, j) => {
    const v = vals[i][j], a = Math.min(1, Math.abs(v) / mx) * 0.85 + 0.08;
    const bg = v >= 0 ? `color-mix(in srgb,var(--pos) ${a * 100}%,var(--surface))` : `color-mix(in srgb,var(--neg) ${a * 100}%,var(--surface))`;
    const fg = a > 0.5 ? '#fff' : 'var(--ink)';
    return `<td style="background:${bg};color:${fg}" class="${r === curR && c === curC ? 'cur' : ''}">${kEur(v)}</td>`;
  }).join('')}</tr>`).join('')}</table><p class="small">Περίγραμμα = πιο κοντά στα σημερινά νούμερα.</p>`);
}

function cashSvg(CF, W = 800) {
  const H = W < 600 ? 220 : 260, P = { l: 52, r: 10, t: 18, b: 28 };
  const pts = [CF.start, ...CF.cum], n = pts.length - 1;
  let lo = Math.min(0, ...pts), hi = Math.max(0, ...pts);
  if (hi - lo < 1) hi = lo + 1;
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const x = i => P.l + (W - P.l - P.r) * i / n;
  const y = v => P.t + (H - P.t - P.b) * (hi - v) / (hi - lo);
  const step = niceStep((hi - lo) / 4);
  let grid = '';
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) grid += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${P.l - 8}" y="${y(v) + 4}" text-anchor="end">${kEur(v)}</text>`;
  let xl = '';
  for (let i = 0; i <= n; i += (W < 600 ? 12 : 6)) xl += `<text x="${x(i)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i + (W < 600 ? 12 : 6) > n ? 'end' : 'middle'}">${i === 0 ? 'Έναρξη' : i + 'ος'}</text>`;
  const line = pts.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const area = `${line}L${x(n)},${y(0)}L${x(0)},${y(0)}Z`;
  const pb = CF.payback ? `<line x1="${x(CF.payback)}" x2="${x(CF.payback)}" y1="${P.t}" y2="${H - P.b}" stroke="var(--pos)" stroke-dasharray="4 4"/><circle cx="${x(CF.payback)}" cy="${y(pts[CF.payback])}" r="5" fill="var(--pos)"/><text x="${x(CF.payback) + (x(CF.payback) > W * 0.65 ? -7 : 7)}" y="${P.t - 4}" text-anchor="${x(CF.payback) > W * 0.65 ? 'end' : 'start'}" style="fill:var(--pos);font-weight:600">απόσβεση · μήνας ${CF.payback}</text>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Σωρευτικό ταμείο ανά μήνα">
    <defs><clipPath id="above"><rect x="0" y="0" width="${W}" height="${y(0)}"/></clipPath><clipPath id="below"><rect x="0" y="${y(0)}" width="${W}" height="${H}"/></clipPath></defs>
    ${grid}${xl}
    <path d="${area}" fill="var(--pos)" opacity=".14" clip-path="url(#above)"/>
    <path d="${area}" fill="var(--neg)" opacity=".12" clip-path="url(#below)"/>
    <line x1="${P.l}" x2="${W - P.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1.2"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pb}
  </svg>`;
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }

/* =========================================================
   CSV IMPORT / EXPORT
   Columns: section,category,name,field,value,note
   Sections listed in the file replace that whole list
   (capex, fixed, service, barber, partner); setting, barista
   and retail rows update single values.
   ========================================================= */
const CSV_COLS = ['section', 'category', 'name', 'field', 'value', 'note'];
const LIST_SECTIONS = { capex: 'Έξοδα έναρξης', fixed: 'Μηνιαία πάγια', service: 'Υπηρεσίες', barber: 'Κουρείς', partner: 'Εταίροι' };
const MODE_ALIASES = { salary: 'salary', 'μισθωτός': 'salary', 'μισθωτος': 'salary', 'μισθός': 'salary', commission: 'commission', 'ποσοστό': 'commission', 'ποσοστο': 'commission', rent: 'rent', 'ενοικίαση': 'rent', 'ενοικιαση': 'rent', 'ενοικίαση θέσης': 'rent', partner: 'partner', 'εταίρος': 'partner', 'εταιρος': 'partner' };
const COFFEE_ALIASES = { free: 'free', 'κερασμένος': 'free', paid: 'paid', 'πωλείται': 'paid', none: 'none', 'χωρίς': 'none' };
const FIELD_MAP = {
  barber: { mode: 'mode', cutsperday: 'cutsPerDay', cuts: 'cutsPerDay', salary: 'salary', bonuspct: 'bonusPct', bonus: 'bonusPct', rent: 'rent', barberpct: 'barberPct', commissionpct: 'barberPct', commission: 'barberPct', ticket: 'ticket' },
  partner: { cappct: 'capPct', capital: 'capPct', share: 'share', profitpct: 'share', sharepct: 'share', role: 'role' },
  service: { price: 'price', mix: 'mix', mixpct: 'mix' },
  capex: { amount: 'amount', on: 'on', enabled: 'on' },
  fixed: { amount: 'amount' }
};
const normKey = k => String(k || '').toLowerCase().replace(/[^a-z0-9]/g, '');
const pickKey = (obj, k) => Object.keys(obj).find(x => normKey(x) === normKey(k));

function csvNum(v) {
  let t = String(v ?? '').replace(/[€%\s]/g, '');
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d+,\d+$/.test(t)) t = t.replace(',', '.');
  else t = t.replace(/,/g, '');
  const n = parseFloat(t);
  return isFinite(n) ? n : null;
}
const csvBool = v => !/^(0|no|false|όχι|οχι|off)$/i.test(String(v).trim());

function parseCsv(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : (first.includes('\t') && !first.includes(',') ? '\t' : ',');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  const head = (rows.shift() || []).map(h => normKey(h));
  const idx = Object.fromEntries(CSV_COLS.map(c => [c, head.indexOf(c)]));
  if (idx.section < 0 || idx.value < 0) throw new Error('Το CSV πρέπει να έχει στήλες: ' + CSV_COLS.join(', '));
  return rows.filter(r => r.some(x => String(x).trim() !== '')).map(r => Object.fromEntries(CSV_COLS.map(c => [c, idx[c] >= 0 ? String(r[idx[c]] ?? '').trim() : ''])));
}

function csvToState(rows, base) {
  const next = clone(base), warn = [], lists = {}, counts = {};
  const order = {};
  const getItem = (sec, key, make) => {
    lists[sec] = lists[sec] || new Map(); order[sec] = order[sec] || [];
    if (!lists[sec].has(key)) { lists[sec].set(key, make()); order[sec].push(key); }
    return lists[sec].get(key);
  };
  rows.forEach((r, n) => {
    const line = n + 2;
    const sec = normKey(r.section).replace(/s$/, '');
    const f = normKey(r.field);
    if (sec === 'capex' || sec === 'fixed') {
      if (!r.name) { warn.push(`Γραμμή ${line}: λείπει όνομα`); return; }
      const it = sec === 'capex'
        ? getItem(sec, (r.category || 'Λοιπά') + '|' + r.name, () => ({ cat: r.category || 'Λοιπά', name: r.name, amount: 0, on: true, note: '' }))
        : getItem(sec, r.name, () => ({ name: r.name, amount: 0, note: '' }));
      const key = FIELD_MAP[sec][f || 'amount'];
      if (key === 'on') it.on = csvBool(r.value);
      else if (key === 'amount') { const v = csvNum(r.value); if (v == null) warn.push(`Γραμμή ${line}: μη έγκυρο ποσό «${r.value}»`); else it.amount = v; }
      else warn.push(`Γραμμή ${line}: άγνωστο πεδίο «${r.field}»`);
      if (r.note) it.note = r.note;
    } else if (sec === 'service' || sec === 'barber' || sec === 'partner') {
      if (!r.name) { warn.push(`Γραμμή ${line}: λείπει όνομα`); return; }
      const make = { service: () => ({ name: r.name, price: 0, mix: 0 }), barber: () => Object.assign(blankBarber(1), { name: r.name }), partner: () => ({ name: r.name, capPct: 0, share: 0, role: '' }) }[sec];
      const it = getItem(sec, r.name, make);
      const key = FIELD_MAP[sec][f];
      if (!key) { warn.push(`Γραμμή ${line}: άγνωστο πεδίο «${r.field}» για ${sec}`); return; }
      if (key === 'mode') { const m = MODE_ALIASES[String(r.value).toLowerCase().trim()]; if (m) it.mode = m; else warn.push(`Γραμμή ${line}: άγνωστο μοντέλο «${r.value}»`); }
      else if (key === 'role') it.role = r.value;
      else { const v = csvNum(r.value); if (v == null) warn.push(`Γραμμή ${line}: μη έγκυρος αριθμός «${r.value}»`); else it[key] = v; }
    } else if (sec === 'setting' || sec === 'barista' || sec === 'retail') {
      const target = sec === 'setting' ? next.settings : next[sec];
      const key = pickKey(target, r.field);
      if (!key) { warn.push(`Γραμμή ${line}: άγνωστη ρύθμιση «${r.field}»`); return; }
      if (key === 'enabled') target[key] = csvBool(r.value);
      else if (key === 'coffeeMode') { const m = COFFEE_ALIASES[String(r.value).toLowerCase().trim()]; if (m) target[key] = m; else warn.push(`Γραμμή ${line}: άγνωστος τρόπος καφέ «${r.value}»`); }
      else { const v = csvNum(r.value); if (v == null) warn.push(`Γραμμή ${line}: μη έγκυρος αριθμός «${r.value}»`); else target[key] = v; }
      counts[sec] = (counts[sec] || 0) + 1;
    } else warn.push(`Γραμμή ${line}: άγνωστη ενότητα «${r.section}»`);
  });
  const target = { capex: 'capex', fixed: 'fixed', service: 'services', barber: 'barbers', partner: 'partners' };
  Object.keys(lists).forEach(sec => { next[target[sec]] = order[sec].map(k => lists[sec].get(k)); counts[sec] = order[sec].length; });
  return { next, warn, counts };
}

function stateToCsv(st) {
  const out = [CSV_COLS];
  const add = (...r) => out.push(r);
  st.capex.forEach(x => { add('capex', x.cat, x.name, 'amount', x.amount, x.note || ''); if (!x.on) add('capex', x.cat, x.name, 'on', 0, ''); });
  st.fixed.forEach(x => add('fixed', '', x.name, 'amount', x.amount, x.note || ''));
  st.services.forEach(x => { add('service', '', x.name, 'price', x.price, ''); add('service', '', x.name, 'mix', x.mix, ''); });
  st.barbers.forEach(b => ['mode', 'cutsPerDay', 'salary', 'bonusPct', 'rent', 'barberPct', 'ticket'].forEach(k => add('barber', '', b.name, k, b[k], '')));
  st.partners.forEach(p => ['capPct', 'share', 'role'].forEach(k => add('partner', '', p.name, k, p[k], '')));
  Object.entries(st.barista).forEach(([k, v]) => add('barista', '', '', k, typeof v === 'boolean' ? (v ? 1 : 0) : v, ''));
  Object.entries(st.retail).forEach(([k, v]) => add('retail', '', '', k, v, ''));
  Object.entries(st.settings).forEach(([k, v]) => add('setting', '', '', k, v, ''));
  return out.map(r => r.map(c => { const t = String(c ?? ''); return /[",\n;]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; }).join(',')).join('\n');
}

async function importCsvFile(f) {
  try {
    const rows = parseCsv(await f.text());
    if (!rows.length) { toast('Το CSV είναι άδειο'); return; }

   SHARED SYNC (Supabase) — state is encrypted in the browser
   with a key derived from the site password; the server only
   stores ciphertext and checks a write token.

const SYNC_URL = 'https://miaaynxgowqyyivtdnhs.supabase.co';
const SYNC_KEY = 'sb_publishable_6xYzhezNfoXDbCQ1GKzupA_bQcuel3X';
const sync = { on: false, key: null, token: null, version: null, timer: null, pending: false, saving: false, state: 'local', by: '', at: null };
const who = () => ls.get(LS_WHO) || '';
const b64e = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

function setSync(st) {
  sync.state = st;
  const t = sync.at ? new Date(sync.at).toLocaleString('el-GR', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
  const map = {
    local: ['var(--muted)', 'μόνο σε αυτή τη συσκευή'],
    ok: ['var(--pos)', `κοινό · ${t}${sync.by ? ' · ' + sync.by : ''}`],
    pending: ['var(--accent)', 'αποθήκευση…'],
    err: ['var(--neg)', 'χωρίς σύνδεση — οι αλλαγές μένουν τοπικά'],
    denied: ['var(--neg)', 'ο κωδικός δεν επιτρέπει αποθήκευση']
  };
  const [c, txt] = map[st] || map.local;
  const el = $('subtitle');
  if (el) el.innerHTML = `Καλαμάτα · <span style="color:${c}">●</span> ${esc(txt)}`;
}
async function rpc(fn, body) {
  const r = await fetch(`${SYNC_URL}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: SYNC_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const txt = await r.text();
  if (!r.ok) { const e = new Error(txt); e.status = r.status; throw e; }
  return txt ? JSON.parse(txt) : null;
}
async function encryptObj(o) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, sync.key, new TextEncoder().encode(JSON.stringify(o)));
  return JSON.stringify({ i: b64e(iv), c: b64e(ct) });
}
async function decryptObj(s) {
  const p = JSON.parse(s);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(p.i) }, sync.key, b64d(p.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function syncInit() {
  const pw = window.__barberPw;
  if (!pw || !window.crypto || !crypto.subtle) { setSync('local'); return; }
  setSync('pending');
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: new TextEncoder().encode('barber-sync-v1'), iterations: 600000, hash: 'SHA-256' }, base, 512));
    sync.key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-GCM', false, ['encrypt', 'decrypt']);
    sync.token = [...bits.slice(32)].map(b => b.toString(16).padStart(2, '0')).join('');
    sync.on = true;
    await pull({ initial: true });
    setInterval(() => { if (!document.hidden) pull({}); }, 20000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) pull({}); });
  } catch (e) { console.error(e); setSync('err'); }
}
async function pull({ initial = false, force = false }) {
  if (!sync.on || (!force && (sync.pending || sync.saving))) return;
  try {
    const r = await rpc('barber_load');
    if (!r) { if (initial) await push(); else setSync('ok'); return; }
    if (r.version === sync.version) { setSync('ok'); return; }
    let o;
    try { o = await decryptObj(r.data); }
    catch (e) { // stored with an older password: replace it with this device's data
      if (initial) { sync.version = r.version; await push(); }
      return;
    }
    const editing = document.activeElement && document.activeElement.matches('#view input, #view select');
    if (!initial && !force && editing) return; // try again on next poll, don't steal focus
    sync.version = r.version; sync.by = r.updated_by || ''; sync.at = r.updated_at;
    S = hydrate(o.state);
    ls.set(LS_KEY, JSON.stringify(S));
    if (o.scenarios) ls.set(LS_SCN, JSON.stringify(o.scenarios));
    renderView();
    setSync('ok');
    if (!initial) toast(`Νέα έκδοση${sync.by ? ' από ' + sync.by : ''}`);
  } catch (e) { console.error(e); setSync('err'); }
}
function schedulePush() {
  if (!sync.on) return;
  sync.pending = true; setSync('pending');
  clearTimeout(sync.timer);
  sync.timer = setTimeout(push, 1200);
}
async function push() {
  sync.pending = false; sync.saving = true;
  try {
    const data = await encryptObj({ state: S, scenarios: scenarios() });
    const r = await rpc('barber_save', { p_token: sync.token, p_data: data, p_version: sync.version, p_by: who() || 'Χωρίς όνομα' });
    if (r && r.ok) { sync.version = r.version; sync.by = who() || 'Χωρίς όνομα'; sync.at = new Date().toISOString(); setSync('ok'); }
    else if (r && r.conflict) {
      sync.saving = false;
      toast('Κάποιος άλλος άλλαξε κάτι ταυτόχρονα — φορτώθηκε η δική του έκδοση');
      await pull({ force: true });
    }
  } catch (e) {
    console.error(e);
    setSync(e.status === 403 || /forbidden|42501/.test(e.message) ? 'denied' : 'err');
  } finally {
    sync.saving = false;
    if (sync.pending) { clearTimeout(sync.timer); sync.timer = setTimeout(push, 1200); }
  }
}

/* =========================================================
   RENDER LOOP
   ========================================================= */
function renderTabs() {
  $('tabs').innerHTML = Object.entries(TABS).map(([k, t]) => `<button class="${k === TAB ? 'on' : ''}" data-act="tab" data-tab="${k}">${t.label}</button>`).join('');
}
const LOCK_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>';
function renderView() {
  if (!TABS[TAB]) TAB = 'overview';
  renderTabs();
  $('view').innerHTML = (S.locked ? `<div class="lockbar"><span>${LOCK_SVG}Κλειδωμένο — τα νούμερα δεν αλλάζουν.</span><button class="btn sec2" data-act="lock">Ξεκλείδωμα</button></div>` : '') + TABS[TAB].render();
  document.body.classList.toggle('locked', !!S.locked);
  if (S.locked) $('view').querySelectorAll('[data-k]').forEach(e => { e.disabled = true; });
  const lb = $('lockBtn');
  lb.innerHTML = LOCK_SVG + `<span class="lbl">${S.locked ? 'Κλειδωμένο' : 'Κλείδωμα'}</span>`;
  lb.classList.toggle('on', !!S.locked);
  refresh();
}
function refresh() {
  const R = compute(S), C = capexTotals(S, R), CF = cashflow(S, C);
  $('strip').innerHTML = [
    ['Καθαρό/μήνα', `<span class="${sgn(R.net)}">${eur(R.net)}</span>`],
    ['Κεφάλαιο', eur(C.total)],
    ['Απόσβεση', CF.payback ? `${CF.payback} μήνες` : '—'],
    ['Πελάτες/μήνα', num(R.clients)]
  ].map(([l, v]) => `<div class="st"><span>${l}</span><b>${v}</b></div>`).join('');
  document.querySelectorAll('[data-show]').forEach(e => { e.textContent = getPath(S, e.dataset.show); });
  TABS[TAB].fill(R);
}

document.addEventListener('input', e => {
  if (e.target.id === 'whoName') { ls.set(LS_WHO, e.target.value.trim()); return; }
  const el = e.target.closest('[data-k]');
  if (!el || S.locked) return;
  const t = el.dataset.t;
  let v;
  if (t === 'b') v = el.checked;
  else if (t === 'n') { v = parseFloat(String(el.value).replace(',', '.')); if (!isFinite(v)) v = 0; }
  else v = el.value;
  setPath(S, el.dataset.k, v);
  save();
  document.querySelectorAll(`[data-k="${el.dataset.k}"]`).forEach(o => { if (o !== el) { if (o.type === 'checkbox') o.checked = v; else o.value = v; } });
  if (el.hasAttribute('data-rr')) renderView(); else refresh();
});

const blankBarber = n => ({ name: `Κουρέας ${n}`, mode: 'salary', cutsPerDay: 8, ticket: 0, salary: 1100, bonusPct: 0, rent: 400, barberPct: 50 });
const ACTIONS = {
  lock: () => {
    if (S.locked && !confirm('Ξεκλείδωμα; Οι αλλαγές θα φαίνονται σε όλους τους εταίρους.')) return false;
    S.locked = !S.locked; toast(S.locked ? 'Κλειδώθηκε για όλους' : 'Ξεκλειδώθηκε');
  },
  tab: d => { TAB = d.tab; ls.set(LS_TAB, TAB); renderView(); window.scrollTo({ top: 0 }); },
  addBarber: () => { S.barbers.push(blankBarber(S.barbers.length + 1)); },
  delBarber: d => { if (confirm(`Αφαίρεση «${S.barbers[d.i].name}»;`)) S.barbers.splice(+d.i, 1); },
  addService: () => { S.services.push({ name: 'Νέα υπηρεσία', price: 10, mix: 0 }); },
  delService: d => { S.services.splice(+d.i, 1); },
  addCapex: d => { S.capex.push({ cat: d.cat, name: 'Νέο έξοδο', amount: 0, on: true, note: '' }); },
  delCapex: d => { S.capex.splice(+d.i, 1); },
  addFixed: () => { S.fixed.push({ name: 'Νέο έξοδο', amount: 0, note: '' }); },
  delFixed: d => { S.fixed.splice(+d.i, 1); },
  addPartner: () => { S.partners.push({ name: 'Νέος εταίρος', capPct: 0, share: 0, role: '' }); },
  delPartner: d => { S.partners.splice(+d.i, 1); },
  saveScn: () => {
    const n = ($('scnName').value || '').trim() || new Date().toLocaleString('el-GR');
    const sc = scenarios(); sc[n] = clone(S); ls.set(LS_SCN, JSON.stringify(sc)); toast(`Αποθηκεύτηκε: ${n}`);
  },
  loadScn: d => { const sc = scenarios(); if (sc[d.n]) { S = hydrate(sc[d.n]); toast(`Φορτώθηκε: ${d.n}`); } },
  delScn: d => { const sc = scenarios(); delete sc[d.n]; ls.set(LS_SCN, JSON.stringify(sc)); },
  export: () => {
    const blob = new Blob([JSON.stringify({ app: 'barber', exported: new Date().toISOString(), state: S, scenarios: scenarios() }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `barber-${new Date().toISOString().slice(0, 10)}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    return false;
  },
  import: () => { $('importFile').click(); return false; },
  importCsvBtn: () => { $('importCsv').click(); return false; },
  exportCsv: () => {
    const blob = new Blob(['\uFEFF' + stateToCsv(S)], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `barber-${new Date().toISOString().slice(0, 10)}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    return false;
  },
  print: () => { TAB = 'overview'; renderView(); setTimeout(() => window.print(), 100); return false; },
  reset: () => { if (confirm('Επαναφορά όλων των νούμερων στις αρχικές εκτιμήσεις; Τα αποθηκευμένα σενάρια μένουν.')) S = clone(DEFAULTS); else return false; },
  theme: () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = nx; ls.set(LS_THEME, nx); return false;
  },
  logout: () => { ls.del('barber.pw'); location.reload(); return false; }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  if (S.locked && /^(add|del|reset|import|loadScn)/.test(el.dataset.act)) { e.preventDefault(); toast('Κλειδωμένο — πάτα «Ξεκλείδωμα»'); return; }
  e.preventDefault();
  const r = fn(el.dataset);
  if (r === false) return;
  if (el.dataset.act !== 'tab') { save(); renderView(); }
});
$('importCsv').addEventListener('change', async e => { const f = e.target.files[0]; if (f) await importCsvFile(f); e.target.value = ''; });
$('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const o = JSON.parse(await f.text());
    if (o.app !== 'barber' || !o.state) throw new Error('bad');
    S = hydrate(o.state);
    if (o.scenarios) ls.set(LS_SCN, JSON.stringify(Object.assign(scenarios(), o.scenarios)));
    save(); renderView(); toast('Εισήχθη');
  } catch (err) { toast('Μη έγκυρο αρχείο'); }
  e.target.value = '';
});

(() => { const t = ls.get(LS_THEME); if (t) document.documentElement.dataset.theme = t; })();
renderView();
syncInit();
let rzT; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(refresh, 150); });
</script>
</body>
</html>
