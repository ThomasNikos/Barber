  finally { btn.classList.remove('spin'); }
}
const LOCK_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>';
const PLAY_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1.5" y="4" width="13" height="8" rx="4"/><path d="M4.5 8h3M6 6.5v3"/><circle cx="10.5" cy="7" r=".7" fill="currentColor"/><circle cx="11.8" cy="9" r=".7" fill="currentColor"/></svg>';
const TARGET_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="3"/><circle cx="8" cy="8" r=".8" fill="currentColor"/></svg>';
function renderView() {
  if (!TABS[TAB]) TAB = 'overview';
  renderTabs();
  setTimeout(() => { if (TAB === 'history') loadHistory(); }, 0);
  document.body.classList.toggle('target', VIEW === 'target');
  document.body.classList.toggle('play', VIEW === 'play');
  const back = `<span class="lbl">← Τωρινά</span><span class="ico">←</span>`;
  const vb = $('viewBtn'), pb = $('playBtn');
  vb.classList.toggle('on', VIEW === 'target');
  vb.title = VIEW === 'target' ? 'Πίσω στα τωρινά νούμερα' : 'Στόχος: κοινά, ξεχωριστά νούμερα που θέλετε να πετύχετε';
  vb.innerHTML = VIEW === 'target' ? back : TARGET_SVG + '<span class="lbl">Στόχος</span>';
  pb.classList.toggle('on', VIEW === 'play');
  pb.title = VIEW === 'play' ? 'Πίσω στα τωρινά νούμερα' : 'Παίξε: δοκίμασε νούμερα μόνο για σένα, χωρίς να αλλάξει τίποτα για τους άλλους';
  pb.innerHTML = VIEW === 'play' ? back : PLAY_SVG + '<span class="lbl">Παίξε</span>';
  const locked = !!S.locked && VIEW !== 'play';
  const bar = VIEW === 'target' ? `<div class="tgtbar"><span class="t">ΣΤΟΧΟΣ</span> <span class="small">— κοινά, ξεχωριστά νούμερα, όπως θα θέλατε να είναι. Ό,τι αλλάζεις εδώ δεν πειράζει τα τωρινά.</span>
    <div class="cmp" id="tgtcmp"></div>
    <div class="btns"><button class="btn" data-act="view">← Πίσω στα τωρινά</button><button class="btn sec2" data-act="tgtReset">Ξανά από τα τωρινά</button></div></div>`
    : VIEW === 'play' ? `<div class="tgtbar playbar"><span class="t">ΠΑΙΞΕ</span> <span class="small">— μόνο για σένα. Άλλαξε ό,τι θέλεις· τίποτα δεν αποθηκεύεται για τους άλλους και δεν μπαίνει στο ιστορικό.</span>
    <div class="cmp" id="tgtcmp"></div>
    <div class="btns"><button class="btn" data-act="play">← Πίσω στα τωρινά</button><button class="btn sec2" data-act="playReset">Ξανά από τα τωρινά</button><button class="btn sec2" data-act="playFromTarget">Πάρε τον Στόχο</button><button class="btn sec2" data-act="playToTarget">Κάν' το Στόχο</button></div></div>` : '';
  $('view').innerHTML = bar + (locked ? `<div class="lockbar"><span>${LOCK_SVG}Κλειδωμένο — τα νούμερα δεν αλλάζουν.</span><button class="btn sec2" data-act="lock">Ξεκλείδωμα</button></div>` : '') + TABS[TAB].render();
  document.body.classList.toggle('locked', locked);
  if (locked) $('view').querySelectorAll('[data-k]').forEach(e => { e.disabled = true; });
  if (VIEW === 'play') setSync(sync.state);
  const lb = $('lockBtn');
  lb.innerHTML = LOCK_SVG + `<span class="lbl">${S.locked ? 'Κλειδωμένο' : 'Κλείδωμα'}</span>`;
  lb.classList.toggle('on', !!S.locked);
  refresh();
}
let rfq = 0;
function refreshSoon() { if (rfq) return; rfq = requestAnimationFrame(() => { rfq = 0; refresh(); }); }
function refresh() {
  CHARTS.clear(); chartSeq = 0; hideTip();
  const R = compute(S), C = capexTotals(S, R), CF = cashflow(S, C);
  const c = R.cost;
  const costTip = tipHTML('Κόστος ανά μήνα', [
    ['', 'Κουρείς (μισθοί/ποσοστά)', eur(c.staff)], ...(c.partner ? [['', 'Εταίροι (% τζίρου)', eur(c.partner)]] : []),
    ['', 'Μπαρίστα', eur(c.barista)], ['', 'Πάγια', eur(c.fixed)], ['', 'Αναλώσιμα', eur(c.consum)],
    ['', 'Καφές & προϊόντα', eur(c.coffee + c.retail)], ['', 'Προμήθειες καρτών', eur(c.card)], ['', 'Φόρος', eur(R.tax)]
  ]);
  $('strip').innerHTML = [
    ['Καθαρό/μήνα', `<span class="${sgn(R.net)}">${eur(R.net)}</span>`],
    ['Κόστος/μήνα', eur(R.costs), costTip],
    ['Έσοδα/μήνα', eur(R.revenue)],
    ['Κεφάλαιο', eur(C.total)],
    ['Απόσβεση', CF.payback ? `${CF.payback} μήνες` : '—'],
    ['Πελάτες/μήνα', num(R.clients)]
  ].map(([l, v, t]) => `<div class="st"${t ? ` data-tip="${attr(t)}"` : ''}><span>${l}</span><b>${v}</b></div>`).join('');
  document.querySelectorAll('[data-show]').forEach(e => { e.textContent = getPath(S, e.dataset.show); });
  TABS[TAB].fill(R);
  if (VIEW !== 'base' && $('tgtcmp')) {
    const B = baseState(), RB = compute(B), CB = capexTotals(B, RB), FB = cashflow(B, CB);
    const S0 = S; S = B; const BB = breakeven(B); S = S0; const BT = breakeven(S);
    const d = (a, b, inv) => { const x = a - b; if (Math.abs(x) < 0.5) return ''; const good = inv ? x < 0 : x > 0; return `<em class="${good ? 'pos' : 'neg'}">${x > 0 ? '+' : '−'}${eur(Math.abs(x))}</em>`; };
    $('tgtcmp').innerHTML = [
      ['Καθαρό/μήνα', `${eur(R.net)}${d(R.net, RB.net)}`, `τωρινά ${eur(RB.net)}`],
      ['Απόσβεση', CF.payback ? `${CF.payback} μήνες` : `> ${CF.H}`, `τωρινά ${FB.payback ? FB.payback + ' μήνες' : '> ' + FB.H}`],
      ['Κεφάλαιο', `${eur(C.total)}${d(C.total, CB.total, true)}`, `τωρινά ${eur(CB.total)}`],
      ['Πελάτες/μήνα', num(R.clients), `τωρινά ${num(RB.clients)} · νεκρό σημείο ${BT.cpd != null ? num1(BT.cpd) : '—'}`]
    ].map(([l, v, e]) => `<div><span>${l}</span><b>${v}</b><span>${e}</span></div>`).join('');
  }
}

document.addEventListener('input', e => {
  if (e.target.id === 'histLogins') { ls.set('barber.histLogins', e.target.checked ? '1' : '0'); loadHistory(); return; }
  const el = e.target.closest('[data-k]');
  if (!el || (S.locked && VIEW !== 'play')) return;
  const t = el.dataset.t;
  let v;
  if (t === 'b') v = el.checked;
  else if (t === 'n') { v = parseFloat(String(el.value).replace(',', '.')); if (!isFinite(v)) v = 0; }
  else v = el.value;
  setPath(S, el.dataset.k, v);
  const cm = el.dataset.k.match(/^capex\.(\d+)\.(qty|unit)$/);
  if (cm) { const x = S.capex[+cm[1]]; x.amount = Math.round((+x.qty || 0) * (+x.unit || 0) * 100) / 100; const t = $(`cxa-${cm[1]}`); if (t) t.textContent = eur(x.amount); }
  save();
  document.querySelectorAll(`[data-k="${el.dataset.k}"]`).forEach(o => { if (o !== el) { if (o.type === 'checkbox') o.checked = v; else o.value = v; } });
  if (el.hasAttribute('data-rr')) renderView(); else refreshSoon();
});

const blankBarber = n => ({ name: `Κουρέας ${n}`, mode: 'salary', cutsPerDay: 8, ticket: 0, salary: 1100, bonusPct: 0, rent: 400, barberPct: 50, turnPct: 0, turnBase: 'shop', otHours: 0, otCutsPerHour: 2, otRate: 0 });
const ACTIONS = {
  view: () => {
    if (VIEW === 'target') { setView('base'); toast('Τωρινά νούμερα'); }
    else {
      const isNew = !cur('target');
      setView('target');
      if (isNew) { S.locked = !!cur('base').locked; toast('Ο Στόχος ξεκινά ως αντίγραφο των τωρινών — άλλαξε ό,τι θέλεις'); }
    }
    window.scrollTo({ top: 0 });
  },
  play: () => {
    if (VIEW === 'play') { setView('base'); toast('Τωρινά νούμερα'); }
    else { const isNew = !cur('play'); setView('play'); if (isNew) toast('Παίξε: αντίγραφο των τωρινών, μόνο για σένα'); }
    window.scrollTo({ top: 0 });
  },
  playReset: () => { if (!confirm('Να ξαναγίνουν τα νούμερα του «Παίξε» ίδια με τα τωρινά;')) return false; S = clone(cur('base')); S.locked = false; toast('Ξανά από τα τωρινά'); },
  playFromTarget: () => { if (!cur('target')) { toast('Δεν υπάρχει Στόχος ακόμα'); return false; } if (!confirm('Να αντιγραφεί ο Στόχος στο «Παίξε»;')) return false; S = clone(cur('target')); S.locked = false; toast('Αντιγράφηκε ο Στόχος'); },
  playToTarget: () => {
    if (cur('base').locked) { toast('Κλειδωμένο — ξεκλείδωσε πρώτα'); return false; }
    if (!confirm('Ο Στόχος θα γίνει ίδιος με αυτά τα νούμερα, για όλους. Συνέχεια;')) return false;
    ST.target = clone(S); ST.target.locked = !!cur('base').locked; save(); schedulePush(); toast('Ο Στόχος ενημερώθηκε για όλους'); return false;
  },
  tgtReset: () => {
    if (VIEW !== 'target' || !confirm('Ο Στόχος θα γίνει ξανά ίδιος με τα τωρινά νούμερα. Συνέχεια;')) return false;
    S = clone(cur('base')); toast('Ο Στόχος αντιγράφηκε από τα τωρινά');
  },
  lock: () => {
    const b = cur('base'), v = !b.locked;
    if (!v && !confirm('Ξεκλείδωμα; Οι αλλαγές θα φαίνονται σε όλους τους εταίρους.')) return false;
    b.locked = v; const t = cur('target'); if (t) t.locked = v;
    save(); schedulePush(); renderView(); toast(v ? 'Κλειδώθηκε για όλους' : 'Ξεκλειδώθηκε'); return false;
  },
  histReload: () => { loadHistory(); return false; },
  period: d => { PERIOD = d.p; ls.set('barber.period', PERIOD); document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.p === PERIOD)); refresh(); return false; },
  restore: d => { restoreVersion(d.id, d.at); return false; },
  tab: d => { TAB = d.tab; ls.set(LS_TAB, TAB); renderView(); window.scrollTo({ top: 0 }); },
  addBarber: () => { S.barbers.push(blankBarber(S.barbers.length + 1)); },
  delBarber: d => { if (confirm(`Αφαίρεση «${S.barbers[d.i].name}»;`)) S.barbers.splice(+d.i, 1); },
  addService: () => { S.services.push({ name: 'Νέα υπηρεσία', price: 10, mix: 0 }); },
  delService: d => { S.services.splice(+d.i, 1); },
  addCapex: d => { S.capex.push({ cat: d.cat, name: 'Νέο έξοδο', qty: 1, unit: 0, amount: 0, on: true, note: '' }); },
  delCapex: d => { S.capex.splice(+d.i, 1); },
  addFixed: () => { S.fixed.push({ name: 'Νέο έξοδο', amount: 0, note: '' }); },
  delFixed: d => { S.fixed.splice(+d.i, 1); },
  addPartner: () => { S.partners.push({ name: 'Νέος εταίρος', capPct: 0, share: 0, role: '' }); },
  delPartner: d => { S.partners.splice(+d.i, 1); },
  saveScn: () => {
    const n = ($('scnName').value || '').trim() || new Date().toLocaleString('el-GR');
    const sc = scenarios(); sc[n] = clone(S); ls.set(LS_SCN, JSON.stringify(sc)); toast(`Αποθηκεύτηκε: ${n}`);
  },
  loadScn: d => { const sc = scenarios(); if (sc[d.n]) { S = hydrate(sc[d.n]); toast(`Φορτώθηκε: ${d.n}`); } },
  delScn: d => { const sc = scenarios(); delete sc[d.n]; ls.set(LS_SCN, JSON.stringify(sc)); },
  export: () => {
    const blob = new Blob([JSON.stringify({ app: 'barber', exported: new Date().toISOString(), state: S, scenarios: scenarios() }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `barber-${new Date().toISOString().slice(0, 10)}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    return false;
  },
  import: () => { $('importFile').click(); return false; },
  importCsvBtn: () => { $('importCsv').click(); return false; },
  exportCsv: () => {
    const blob = new Blob(['\uFEFF' + stateToCsv(S)], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `barber-${new Date().toISOString().slice(0, 10)}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    return false;
  },
  print: () => { TAB = 'overview'; renderView(); setTimeout(() => window.print(), 100); return false; },
  reset: () => { if (confirm('Επαναφορά όλων των νούμερων στις αρχικές εκτιμήσεις; Τα αποθηκευμένα σενάρια μένουν.')) S = clone(DEFAULTS); else return false; },
  theme: () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = nx; ls.set(LS_THEME, nx); return false;
  },
  logout: () => { ls.del('barber.pw'); try { sessionStorage.removeItem('barber.pw'); } catch (e) {} location.reload(); return false; },
  refresh: () => { doRefresh(); return false; }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  if (S.locked && VIEW !== 'play' && /^(add|del|reset|import|loadScn|tgtReset)/.test(el.dataset.act)) { e.preventDefault(); toast('Κλειδωμένο — πάτα «Ξεκλείδωμα»'); return; }
  e.preventDefault();
  const r = fn(el.dataset);
  if (r === false) return;
  if (el.dataset.act !== 'tab') { save(); renderView(); }
});
$('importCsv').addEventListener('change', async e => { const f = e.target.files[0]; if (f) await importCsvFile(f); e.target.value = ''; });
$('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const o = JSON.parse(await f.text());
    if (o.app !== 'barber' || !o.state) throw new Error('bad');
    S = hydrate(o.state);
    if (o.scenarios) ls.set(LS_SCN, JSON.stringify(Object.assign(scenarios(), o.scenarios)));
    save(); renderView(); toast('Εισήχθη');
  } catch (err) { toast('Μη έγκυρο αρχείο'); }
  e.target.value = '';
});

(() => { const t = ls.get(LS_THEME); if (t) document.documentElement.dataset.theme = t; })();
renderView();
syncInit();
let rzT; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(refresh, 150); });
</script>
